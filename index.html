<style>
:root{--bg:#faf6ef;--card:#fff;--ink:#2b2a33;--mute:#76717f;--acc:#b5722f;--acc2:#e9d3b4;--line:#eadfce;--ok:#2f8f5b}
:root[data-theme=dark]{--bg:#1c1a1f;--card:#27242c;--ink:#f1ece4;--mute:#a49ead;--acc:#e0a062;--acc2:#3a3126;--line:#3a3540}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c1a1f;--card:#27242c;--ink:#f1ece4;--mute:#a49ead;--acc:#e0a062;--acc2:#3a3126;--line:#3a3540}}
html[data-calm]{--acc:#5f8a84;--acc2:#dbe8e5}
html[data-calm] *{animation:none!important;transition:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Georgia,serif;padding-bottom:100px}
header{padding:18px 16px 4px;max-width:720px;margin:auto}
h1{margin:0;font-size:26px}h2{margin:12px 0 4px;font-size:21px}h3{margin:0 0 4px;font-size:18px}
.sub{color:var(--mute);font-size:14px;font-family:system-ui,sans-serif}
main{max-width:720px;margin:auto;padding:4px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.meta{font:13px system-ui,sans-serif;color:var(--mute)}
.who{display:inline-block;padding:1px 9px;border-radius:99px;background:var(--acc2);color:var(--ink);font:12px system-ui,sans-serif;margin-right:6px}
.verse{font-size:21px;font-style:italic;line-height:1.45;margin:6px 0}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:grid;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{background:none;border:0;color:var(--mute);font:12px system-ui,sans-serif;padding:6px 2px;border-radius:10px;cursor:pointer}
nav button span{display:block;font-size:22px}
nav button.on{color:var(--acc);background:var(--acc2)}
button:active{transform:scale(.97)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:600 16px system-ui,sans-serif;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:none;color:var(--acc);border:1px solid var(--acc)}
.btn.small{padding:6px 12px;font-size:14px}
.btn.giant{display:block;width:100%;padding:22px;font-size:20px;border-radius:18px;margin:10px 0;text-align:center}
.btn[disabled]{opacity:.6}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.add{width:100%;margin:8px 0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:99px;font:14px system-ui,sans-serif;cursor:pointer}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
label{display:block;font:600 14px system-ui,sans-serif;margin:12px 0 4px}
input,textarea,select{width:100%;font:16px system-ui,sans-serif;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=checkbox]{width:auto}
textarea{min-height:100px}
dialog{border:0;border-radius:16px;padding:18px;width:min(92vw,480px);max-height:88vh;overflow:auto;background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0008}
.banner{background:var(--acc2);border-radius:10px;padding:8px 12px;font:13px system-ui,sans-serif;margin:8px 0}
.done{opacity:.65}
.empty{color:var(--mute);text-align:center;padding:26px 10px;font-family:system-ui,sans-serif}
.ph{width:100%;border-radius:10px;margin-top:8px;display:block}
.react{background:none;border:1px solid var(--line);border-radius:99px;padding:4px 10px;font:14px system-ui,sans-serif;color:var(--ink);cursor:pointer}
.react.on{background:var(--acc2);border-color:var(--acc)}
.cm{font:14px system-ui,sans-serif;margin-top:8px;padding-top:6px;border-top:1px dashed var(--line)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ok)}
.toast{position:fixed;left:12px;right:12px;bottom:104px;max-width:480px;margin:auto;background:#222;color:#fff;border-radius:12px;padding:12px 16px;font:15px system-ui,sans-serif;z-index:20;display:flex;gap:12px;justify-content:space-between;align-items:center}
.toast button{background:none;border:0;color:#ffd08a;font:600 15px system-ui,sans-serif;cursor:pointer}
.big{font-size:42px;text-align:center;margin:6px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.help{position:fixed;right:14px;bottom:calc(86px + env(safe-area-inset-bottom));width:44px;height:44px;border-radius:50%;background:var(--acc);color:#fff;border:0;font:700 20px system-ui,sans-serif;z-index:6;box-shadow:0 2px 8px #0004}
.chat{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.bub{max-width:82%;padding:8px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);font:16px system-ui,sans-serif;align-self:flex-start}
.bub.me{align-self:flex-end;background:var(--acc2)}
.bub small{display:block;color:var(--mute);font-size:11px}
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.agrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer}
.breath{width:150px;height:150px;border-radius:50%;background:var(--acc2);border:3px solid var(--acc);margin:22px auto;display:flex;align-items:center;justify-content:center;font:600 16px system-ui,sans-serif;text-align:center;transition:transform 4s ease-in-out}
details.card summary{font-weight:600;cursor:pointer}
.cross{text-decoration:line-through;opacity:.6}
.locked{text-align:center;opacity:.85}
.stick{position:sticky;bottom:90px}
</style>
</head>

/* ---------- bible text ---------- */
async function bibleFetch(ref){
  const k="fh_b_"+ver+"_"+ref;
  try{const c=localStorage.getItem(k);if(c)return JSON.parse(c);}catch(e){}
  const r=await fetch("https://bible-api.com/"+encodeURIComponent(ref)+"?translation="+ver);
  const j=await r.json();
  if(j&&j.text){
    const o={ref:j.reference||ref,text:j.text.trim().replace(/\s*\n\s*/g," "),verses:(j.verses||[]).map(v=>v.verse)};
    try{localStorage.setItem(k,JSON.stringify(o));}catch(e){}
    return o;
  }
  throw new Error("not found");
}

/* ---------- share card ---------- */
function wrapLines(g,text,maxW){
  const words=text.split(" "),lines=[];let cur="";
  for(const w of words){const t=cur?cur+" "+w:w;if(g.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}
  if(cur)lines.push(cur);return lines;
}
function shareCard(ref,text){
  const c=document.createElement("canvas");c.width=1080;c.height=1350;const g=c.getContext("2d");
  const gr=g.createLinearGradient(0,0,1080,1350);gr.addColorStop(0,"#1c1a1f");gr.addColorStop(1,"#4a3523");g.fillStyle=gr;g.fillRect(0,0,1080,1350);
  g.textAlign="center";g.fillStyle="#e0a062";g.font="bold 42px sans-serif";g.fillText("VERSE OF THE DAY",540,150);
  let size=64,lines=[];
  for(;size>=30;size-=2){g.font=`italic ${size}px Georgia, serif`;lines=wrapLines(g,"“"+text+"”",880);if(lines.length*size*1.4<=800)break;}
  g.fillStyle="#f1ece4";const top=Math.max(280,675-lines.length*size*0.7);
  lines.forEach((l,i)=>g.fillText(l,540,top+i*size*1.4));
  g.fillStyle="#e0a062";g.font="bold 48px sans-serif";g.fillText(ref,540,Math.min(1180,top+lines.length*size*1.4+90));
  g.fillStyle="#a49ead";g.font="32px sans-serif";g.fillText("Faith Hub",540,1280);
  c.toBlob(async b=>{
    const f=new File([b],"verse.png",{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],text:ref});return;}catch(e){}}
    const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="verse.png";document.body.appendChild(a);a.click();a.remove();
    toast("Saved the picture to your downloads");
  },"image/png");
}

async function toggleRec(){
  if(rec&&rec.state==="recording"){rec.stop();return;}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    const mime=window.MediaRecorder&&MediaRecorder.isTypeSupported("audio/webm;codecs=opus")?"audio/webm;codecs=opus":(MediaRecorder.isTypeSupported("audio/mp4")?"audio/mp4":"");
    rec=new MediaRecorder(st,mime?{mimeType:mime,audioBitsPerSecond:24000}:{audioBitsPerSecond:24000});chunks=[];voiceDraft=null;
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{st.getTracks().forEach(t=>t.stop());clearTimeout(recTimer);const b=new Blob(chunks,{type:rec.mimeType||"audio/webm"});const fr=new FileReader();fr.onload=()=>{voiceDraft=fr.result;render();};fr.readAsDataURL(b);};
    rec.start();recTimer=setTimeout(()=>{if(rec&&rec.state==="recording")rec.stop();},60000);render();
  }catch(e){toast("Microphone is not available");}
}

  let end=Date.now()+mins*60000,pi=-1,left=0;

    if(Date.now()>=end){stopCalm();if(el){el.textContent="Well done 💛";el.style.transform="scale(1)";}return;}
    if(left<=0){pi=(pi+1)%3;left=phases[pi][1];if(el){el.style.transition=`transform ${phases[pi][1]}s ease-in-out`;el.style.transform=`scale(${phases[pi][2]})`;el.textContent=phases[pi][0];}}
    left--;
  };
  tick();calmTimer=setInterval(tick,1000);
}

async function afterRender(){
  const pb=$("partbox");
  if(pb){try{const r=await bibleFetch(pb.dataset.ref);if($("partbox"))$("partbox").innerHTML=`<p style="font-size:19px">${esc(r.text)}</p>`;}catch(e){if($("partbox"))$("partbox").textContent="Could not load the text. Use the Open in my Bible button.";}}
  const ps=$("psbox");
  if(ps){try{const r=await bibleFetch(ps.dataset.ref);if($("psbox"))$("psbox").innerHTML=`<p style="font-size:18px">${esc(r.text)}</p>`;}catch(e){if($("psbox"))$("psbox").textContent="Could not load the text. Use the Open in my Bible button.";}}
  const tb=$("topicbox");
  if(tb){
    const t=tb.dataset.topic;
    const rs=await Promise.allSettled(TOPICS[t].map(r=>bibleFetch(r)));
    topicRes=rs.filter(x=>x.status==="fulfilled").map(x=>x.value);
    if($("topicbox"))$("topicbox").innerHTML=topicRes.length?topicRes.map((v,i)=>`<div class="card"><p class="verse" style="font-size:18px">"${esc(v.text)}"</p><div class="meta">${esc(v.ref)}</div>
      <div class="row"><button class="btn small" data-act="savetv" data-i="${i}">Save to our verse bank</button><button class="btn small ghost" data-act="sharetv" data-i="${i}">📤</button><button class="btn small ghost" data-act="speaktv" data-i="${i}">🔊</button></div></div>`).join(""):`<p class="empty">Could not load verses. Check your connection.</p>`;
  }
}
function render(){
  const ae=document.activeElement;
  if(ae&&ae.id==="q"&&$("lst")){$("lst").innerHTML=listItems(curSub());return;}
  if(ae&&ae.id==="cin"&&$("chatlist")){
    $("chatlist").innerHTML=chatHtml(items.filter(i=>i.type==="msg"&&visible(i)).sort((a,b)=>(a.created||0)-(b.created||0)).slice(-100));return;
  }
  if(ae&&["chapin","vtitle"].includes(ae.id))return;
  if(!(grp==="faith"&&subSel.faith==="calm"))stopCalm();
  $("hello").textContent=me?`Hi ${me}. This is your shared space.`:"";
  const gk=Object.keys(GROUPS).filter(k=>!(simple&&k==="outdoor"));
  $("nav").style.gridTemplateColumns=`repeat(${gk.length},1fr)`;
  $("nav").innerHTML=gk.map(k=>`<button class="${k===grp?"on":""}" data-act="nav" data-g="${k}"><span>${GROUPS[k].icon}</span>${GROUPS[k].label}</button>`).join("");
  if(simple&&grp==="outdoor")grp="home";
  const m=$("main");
  let html=(db?"":`<div class="banner">Not shared yet: entries only save on this device.</div>`)+(offline?`<div class="banner">You are offline. Changes will save when you are back.</div>`:"");
  if(grp==="home")html+=homeView();
  else if(grp==="more")html+=moreView();
  else{
    const subs=subsFor(grp);let cur=subSel[grp];if(!subs.includes(cur)){cur=subs[0];subSel[grp]=cur;}
    if(subs.length>1)html+=`<div class="chips">${subs.map(s=>`<button class="chip ${s===cur?"on":""}" data-act="sub" data-s="${s}">${LBL[s]||s}</button>`).join("")}</div>`;
    html+=viewFor(cur);
  }
  m.innerHTML=html;
  afterRender();
  if($("chatlist")){window.scrollTo(0,document.body.scrollHeight);}
}

/* ---------- actions ---------- */
document.addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value;if($("lst"))$("lst").innerHTML=listItems(curSub());}});
document.addEventListener("change",e=>{
  const a=e.target.dataset&&e.target.dataset.act;
  if(a==="planpick")setMeta("settings",{plan:e.target.value});
  if(a==="verpick"){ver=e.target.value;localStorage.setItem("fh_ver",ver);daily=null;loadDaily();}
});
document.addEventListener("click",async e=>{
  const w=e.target.closest("[data-w]");
  if(w&&W){
    const a=w.dataset.w;
    if(a==="next"){wizCapture();W.i++;wizDraw();}
    else if(a==="back"){wizCapture();W.i=Math.max(0,W.i-1);wizDraw();}
    else if(a==="save")wizSave();
    return;
  }
  const b=e.target.closest("[data-act]");if(!b||b.tagName==="SELECT")return;
  const a=b.dataset.act,d=b.dataset;
  const it=d.id?items.find(x=>x.id===d.id):null;
  if(a==="nav"){grp=d.g;filt="all";q="";render();scrollTo(0,0);}
  else if(a==="goto"){closeDlg();grp=d.g;subSel[d.g]=d.s;filt="all";q="";render();scrollTo(0,0);}
  else if(a==="sub"){subSel[grp]=d.s;filt="all";q="";render();}
  else if(a==="filt"){filt=d.p;render();}
  else if(a==="cat"){catFilt=d.c;render();}
  else if(a==="add"){let pre=null;try{pre=d.pre?JSON.parse(d.pre):null;}catch(x){}addAction(d.t,pre);}
  else if(a==="wiz")openWizard(d.t);
  else if(a==="edit"&&it)openForm(it.type,it);
  else if(a==="del"){e.preventDefault();del(d.id);}
  else if(a==="comment")openComment(d.id);
  else if(a==="react"&&it){
    if(!db){toast("Sharing is not set up yet");return;}
    const has=((it.reactions||{})[d.k]||[]).includes(me);
    patch(d.id,{["reactions."+d.k]:has?FV.arrayRemove(me):FV.arrayUnion(me)});
  }
  else if(a==="vote"&&it){
    const o=d.k==="a"?"b":"a";
    patch(d.id,{["votes."+d.k]:FV.arrayUnion(me),["votes."+o]:FV.arrayRemove(me)});
  }
  else if(a==="todo"&&it)save({...it,done:!it.done});
  else if(a==="answered"&&it)save({...it,answered:!it.answered});
  else if(a==="goal"&&it)save({...it,progress:d.v});
  else if(a==="sharecard"&&it)shareCard(it.ref||"",it.text);
  else if(a==="speak"&&it)speak(it.text);
  else if(a==="sharedaily"){const v=daily||DEFAULTS[dayNum()%DEFAULTS.length];shareCard(v.ref,v.text);}
  else if(a==="speakdaily"){const v=daily||DEFAULTS[dayNum()%DEFAULTS.length];speak(v.text+" "+v.ref);}
  else if(a==="read")setMeta("reads",{[me||"Someone"]:FV?FV.arrayUnion(ymd(new Date())):[]});
  else if(a==="mood")setMeta("moodlog",{[me||"Someone"]:FV?FV.arrayUnion(ymd(new Date())+":"+d.m):[]});
  else if(a==="ping"){if(!db){toast("Sharing is not set up yet");return;}db.collection("pings").add({from:me||"Someone",ts:Date.now()}).then(()=>toast("Sent 💛")).catch(()=>toast("Could not send"));}
  else if(a==="hard")hardDay();
  else if(a==="jarpull"){
    const l=items.filter(i=>i.type==="jar"&&i.text&&visible(i));
    if(!l.length)toast("The jar is empty. Add an encouraging note in Together, Jar.");
    else{const j=l[Math.floor(Math.random()*l.length)];openDlg(`<h3>🫙 From the jar</h3><p class="verse">${nl(j.text)}</p><div class="meta">from ${esc(j.author)}</div><div class="row"><button class="btn" data-act="jarpull">Another</button><button class="btn ghost" data-act="close">Close</button></div>`);}
  }
  else if(a==="plan"){
    const key=(metas.settings||{}).plan||"john",wl=(((metas["plan_"+key]||{}).done||{})[d.d])||[];
    setMeta("plan_"+key,{done:{[d.d]:wl.includes(me)?FV.arrayRemove(me):FV.arrayUnion(me)}});
  }
  else if(a==="chapstart"){
    const ref=($("chapin").value||"").trim();if(!ref){toast("Type a chapter first, like John 3");return;}
    if(!db){toast("Sharing is not set up yet");return;}
    try{
      const r=await bibleFetch(ref),vs=r.verses;
      if(!vs.length)throw new Error("none");
      const parts=[];for(let i=0;i<vs.length;i+=8)parts.push([vs[i],vs[Math.min(i+7,vs.length-1)]]);
      if(parts.length>1){const lp=parts[parts.length-1];if(lp[1]-lp[0]<3){const pp=parts[parts.length-2];pp[1]=lp[1];parts.pop();}}
      const mk=ymd(new Date()).slice(0,7);
      db.collection("meta").doc("chap_"+mk).set({ref:r.ref,parts:parts.map(p=>p[0]===p[1]?String(p[0]):p[0]+"-"+p[1]),done:{}}).catch(()=>toast("Could not save"));
    }catch(x){toast(navigator.onLine?"Could not find that chapter. Try a name like John 3":"This needs internet");}
  }
  else if(a==="partdone"){const mk=ymd(new Date()).slice(0,7);setMeta("chap_"+mk,{done:{[d.i]:FV.arrayUnion(me)}});setMeta("reads",{[me||"Someone"]:FV.arrayUnion(ymd(new Date()))});toast("Nice work 💛");}
  else if(a==="chapreset"){if(confirm("Pick a different chapter? Progress for this month will be cleared.")){const mk=ymd(new Date()).slice(0,7);db&&db.collection("meta").doc("chap_"+mk).delete();}}
  else if(a==="psalmpray"){openForm("prayer",null,{for:"Psalm "+d.n,text:""});}
  else if(a==="topic"){topicSel=d.t;render();}
  else if(a==="savetv"){const v=topicRes[d.i];if(v){saveNew("verse",{ref:v.ref,text:v.text,tag:"Encouragement"});toast("Saved to the verse bank ✅");}}
  else if(a==="sharetv"){const v=topicRes[d.i];if(v)shareCard(v.ref,v.text);}
  else if(a==="speaktv"){const v=topicRes[d.i];if(v)speak(v.text);}
  else if(a==="calmgo")startCalm(Number(d.m));
  else if(a==="calmstop"){stopCalm();const el=$("breath");if(el){el.textContent="Ready";el.style.transform="scale(1)";}}
  else if(a==="memoflip"){memoShow=!memoShow;render();}
  else if(a==="memonext"){memoI++;memoShow=false;render();}
  else if(a==="memoshuf"){memoI=Math.floor(Math.random()*versePool().length);memoShow=false;render();}
  else if(a==="send"||a==="quick"){
    const t=a==="quick"?d.m:($("cin").value||"").trim();if(!t)return;
    saveNew("msg",{text:t});if($("cin"))$("cin").value="";
  }
  else if(a==="bigphoto"&&it)openDlg(`<img src="${it.photo}" style="width:100%;border-radius:10px"><p>${esc(it.text||it.title||"")}</p><div class="meta">${esc(it.author||"")}</div><div class="row"><button class="btn" data-act="close">Close</button></div>`);
  else if(a==="rec")toggleRec();
  else if(a==="vsave"){if(voiceDraft){if(voiceDraft.length>900000){toast("That recording is too long. Try under a minute.");return;}saveNew("voice",{title:($("vtitle").value||"Voice note"),audio:voiceDraft});voiceDraft=null;render();toast("Saved 🎙️");}}
  else if(a==="vdiscard"){voiceDraft=null;render();}
  else if(a==="prayed"){const wk=Math.floor(dayNum()/7);const l=((metas.prayed||{})["w"+wk])||[];setMeta("prayed",{["w"+wk]:l.includes(me)?FV.arrayRemove(me):FV.arrayUnion(me)});}
  else if(a==="wyr"){setMeta("wyr",{a:{["d"+dayNum()]:{[me]:d.k}}});}
  else if(a==="quizpick"){if(quizPick===null){quizPick=Number(d.i);if(quizPick===QUIZ[quizI].a)quizScore++;render();}}
  else if(a==="quiznext"){quizI++;quizPick=null;render();}
  else if(a==="quizreset"){quizI=0;quizScore=0;quizPick=null;render();}
  else if(a==="who"){me=d.p;localStorage.setItem("fh_me",me);closeDlg();const cb=askWho.cb;askWho.cb=null;if(cb)cb();else{markSeen();if(db&&"Notification" in window&&Notification.permission==="granted")ensureToken(false);render();}}
  else if(a==="askwho")askWho(null);
  else if(a==="avatar"){setMeta("avatars",{[me||"Someone"]:d.a});}
  else if(a==="simple"){simple=!simple;localStorage.setItem("fh_simple",simple?"1":"0");if(simple&&!localStorage.getItem("fh_fs"))document.body.style.fontSize="19px";else if(!simple&&!localStorage.getItem("fh_fs"))document.body.style.fontSize="";grp="home";render();}
  else if(a==="calm"){const on=localStorage.getItem("fh_calm")!=="1";localStorage.setItem("fh_calm",on?"1":"0");if(on)document.documentElement.dataset.calm="1";else delete document.documentElement.dataset.calm;render();}
  else if(a==="theme"){localStorage.setItem("fh_theme",d.t);if(d.t==="auto")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=d.t;render();}
  else if(a==="accent"){localStorage.setItem("fh_acc",d.c);document.documentElement.style.setProperty("--acc",d.c);}
  else if(a==="fs"){const cur=parseInt(getComputedStyle(document.body).fontSize)||17;const n=Math.max(14,Math.min(26,cur+Number(d.d)*2));document.body.style.fontSize=n+"px";localStorage.setItem("fh_fs",n);}
  else if(a==="notif")enablePush();
  else if(a==="setpin"){const p=prompt("Choose a PIN (numbers only)");if(p){localStorage.setItem("fh_pin",await sha(p));toast("PIN saved");render();}}
  else if(a==="clearpin"){localStorage.removeItem("fh_pin");toast("PIN removed");render();}
  else if(a==="review")reviewDialog();
  else if(a==="journal")download("faith-hub-journal.html",journalHtml(),"text/html");
  else if(a==="backup")download("faith-hub-backup.json",JSON.stringify({items,metas},null,1),"application/json");
  else if(a==="help")openDlg(`<h3>❓ Help</h3>${HELP.map(([q2,a2])=>`<details class="card"><summary>${esc(q2)}</summary><p>${esc(a2)}</p></details>`).join("")}<div class="row"><button class="btn ghost" data-act="feedback">✉️ Send feedback</button><button class="btn" data-act="close">Close</button></div>`);
  else if(a==="feedback"){openDlg(`<h3>✉️ Send feedback</h3><textarea id="fbt" placeholder="What is confusing or not working?"></textarea><div class="row"><button class="btn" data-act="fbsend">Send</button><button class="btn ghost" data-act="close">Cancel</button></div>`);}
  else if(a==="fbsend"){const t=($("fbt").value||"").trim();if(t&&db){db.collection("feedback").add({from:me||"Someone",text:t,ts:Date.now(),v:APP_VER}).then(()=>toast("Thank you! Sent.")).catch(()=>toast("Could not send"));}closeDlg();}
  else if(a==="news")showNews();
  else if(a==="newsdone"){localStorage.setItem("fh_ver_seen",APP_VER);closeDlg();}
  else if(a==="tour"){const i=Number(d.i);if(i>=TOUR.length){localStorage.setItem("fh_tour","1");localStorage.setItem("fh_ver_seen",APP_VER);closeDlg();render();}else openTour(i);}
  else if(a==="tourreplay")openTour(0);
  else if(a==="lookup")lookup(false);
  else if(a==="lookupw"){wizCapture();lookup(true);}
  else if(a==="dictate")dictate(d.n);
  else if(a==="close")closeDlg();
});
window.addEventListener("error",e=>{if(db&&errCount++<5)db.collection("errors").add({msg:String(e.message).slice(0,200),line:e.lineno||0,from:me||"?",ts:Date.now(),v:APP_VER}).catch(()=>{});});
window.addEventListener("unhandledrejection",e=>{if(db&&errCount++<5)db.collection("errors").add({msg:String(e.reason&&e.reason.message||e.reason).slice(0,200),from:me||"?",ts:Date.now(),v:APP_VER}).catch(()=>{});});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
start();
</script>
</body>
</html>
