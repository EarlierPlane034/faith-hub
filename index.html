<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Faith Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c1a1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Faith Hub">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<style>
:root{--bg:#faf6ef;--card:#fff;--ink:#2b2a33;--mute:#76717f;--acc:#b5722f;--acc2:#e9d3b4;--line:#eadfce;--ok:#2f8f5b}
:root[data-theme=dark]{--bg:#1c1a1f;--card:#27242c;--ink:#f1ece4;--mute:#a49ead;--acc:#e0a062;--acc2:#3a3126;--line:#3a3540}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c1a1f;--card:#27242c;--ink:#f1ece4;--mute:#a49ead;--acc:#e0a062;--acc2:#3a3126;--line:#3a3540}}
html[data-calm]{--acc:#5f8a84;--acc2:#dbe8e5}
html[data-calm] *{animation:none!important;transition:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Georgia,serif;padding-bottom:100px}
header{padding:18px 16px 4px;max-width:720px;margin:auto}
h1{margin:0;font-size:26px}h2{margin:12px 0 4px;font-size:21px}h3{margin:0 0 4px;font-size:18px}
.sub{color:var(--mute);font-size:14px;font-family:system-ui,sans-serif}
main{max-width:720px;margin:auto;padding:4px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.meta{font:13px system-ui,sans-serif;color:var(--mute)}
.who{display:inline-block;padding:1px 9px;border-radius:99px;background:var(--acc2);color:var(--ink);font:12px system-ui,sans-serif;margin-right:6px}
.verse{font-size:21px;font-style:italic;line-height:1.45;margin:6px 0}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:grid;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{background:none;border:0;color:var(--mute);font:12px system-ui,sans-serif;padding:6px 2px;border-radius:10px;cursor:pointer}
nav button span{display:block;font-size:22px}
nav button.on{color:var(--acc);background:var(--acc2)}
button:active{transform:scale(.97)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:600 16px system-ui,sans-serif;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:none;color:var(--acc);border:1px solid var(--acc)}
.btn.small{padding:6px 12px;font-size:14px}
.btn.giant{display:block;width:100%;padding:22px;font-size:20px;border-radius:18px;margin:10px 0;text-align:center}
.btn[disabled]{opacity:.6}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.add{width:100%;margin:8px 0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:99px;font:14px system-ui,sans-serif;cursor:pointer}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
label{display:block;font:600 14px system-ui,sans-serif;margin:12px 0 4px}
input,textarea,select{width:100%;font:16px system-ui,sans-serif;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=checkbox]{width:auto}
textarea{min-height:100px}
dialog{border:0;border-radius:16px;padding:18px;width:min(92vw,480px);max-height:88vh;overflow:auto;background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0008}
.banner{background:var(--acc2);border-radius:10px;padding:8px 12px;font:13px system-ui,sans-serif;margin:8px 0}
.done{opacity:.65}
.empty{color:var(--mute);text-align:center;padding:26px 10px;font-family:system-ui,sans-serif}
.ph{width:100%;border-radius:10px;margin-top:8px;display:block}
.react{background:none;border:1px solid var(--line);border-radius:99px;padding:4px 10px;font:14px system-ui,sans-serif;color:var(--ink);cursor:pointer}
.react.on{background:var(--acc2);border-color:var(--acc)}
.cm{font:14px system-ui,sans-serif;margin-top:8px;padding-top:6px;border-top:1px dashed var(--line)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ok)}
.toast{position:fixed;left:12px;right:12px;bottom:104px;max-width:480px;margin:auto;background:#222;color:#fff;border-radius:12px;padding:12px 16px;font:15px system-ui,sans-serif;z-index:20;display:flex;gap:12px;justify-content:space-between;align-items:center}
.toast button{background:none;border:0;color:#ffd08a;font:600 15px system-ui,sans-serif;cursor:pointer}
.big{font-size:42px;text-align:center;margin:6px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.help{position:fixed;right:14px;bottom:calc(86px + env(safe-area-inset-bottom));width:44px;height:44px;border-radius:50%;background:var(--acc);color:#fff;border:0;font:700 20px system-ui,sans-serif;z-index:6;box-shadow:0 2px 8px #0004}
.chat{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.bub{max-width:82%;padding:8px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);font:16px system-ui,sans-serif;align-self:flex-start}
.bub.me{align-self:flex-end;background:var(--acc2)}
.bub small{display:block;color:var(--mute);font-size:11px}
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.agrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer}
.breath{width:150px;height:150px;border-radius:50%;background:var(--acc2);border:3px solid var(--acc);margin:22px auto;display:flex;align-items:center;justify-content:center;font:600 16px system-ui,sans-serif;text-align:center;transition:transform 4s ease-in-out}
details.card summary{font-weight:600;cursor:pointer}
.cross{text-decoration:line-through;opacity:.6}
.locked{text-align:center;opacity:.85}
.stick{position:sticky;bottom:90px}
.card{box-shadow:0 1px 3px #0000000d,0 6px 18px #00000008}
.btn{box-shadow:0 1px 2px #0003}
nav{box-shadow:0 -4px 16px #00000012}
nav button.on{font-weight:700}
.chip{transition:background .15s}
header{padding-top:max(18px,env(safe-area-inset-top))}
.badge{display:inline-block;font:12px system-ui,sans-serif;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute);margin-left:6px}
.visbox{background:var(--acc2);border-radius:12px;padding:6px 12px 12px;margin-top:14px}
.visbox label{margin-top:6px}
header{position:relative}
.hbtn{position:absolute;right:14px;top:max(16px,env(safe-area-inset-top));background:var(--card);border:1px solid var(--line);border-radius:50%;width:42px;height:42px;font-size:18px;cursor:pointer}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 8px;font:600 16px system-ui,sans-serif;color:var(--ink);cursor:pointer;box-shadow:0 1px 3px #0000000d,0 6px 18px #00000008}
.tile span{display:block;font-size:38px;margin-bottom:6px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.bigact{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 4px;font:600 16px system-ui,sans-serif;color:var(--ink);cursor:pointer}
.bigact span{display:block;font-size:34px}
.bigact[disabled]{opacity:.85}
.vcard{color:#fff;border:0;padding:22px 20px;border-radius:20px;text-shadow:0 1px 6px #0006}
.vcard .meta{color:#ffffffcc}
.vcard .verse{font-size:23px}
.sc-dusk{background:linear-gradient(160deg,#3b2a5c,#b5547a 60%,#f0a35e)}
.sc-forest{background:linear-gradient(160deg,#173a2e,#2f6b4f 65%,#8dbb7a)}
.sc-ocean{background:linear-gradient(160deg,#0f3057,#2b78a8 65%,#8ed1e0)}
.sc-sunrise{background:linear-gradient(160deg,#7a3e5c,#e0795a 60%,#f6c56b)}
.sc-night{background:linear-gradient(160deg,#0b1026,#27285a 70%,#4b4a8a)}
.more>summary{list-style:none;cursor:pointer;text-align:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card);font:600 15px system-ui,sans-serif;margin:12px 0}
html[data-font=clean] body{font-family:system-ui,-apple-system,sans-serif}
html[data-font=easy] body{font-family:Verdana,Tahoma,sans-serif;letter-spacing:.02em;line-height:1.75;word-spacing:.1em}
.cf{position:fixed;inset:0;pointer-events:none;z-index:50}
.lbox{width:100%;border-radius:10px;touch-action:pan-y}

/* v4.1 polish */
:root{--bg:#fbf7f1;--acc:#c2703a;--acc2:#f7e6d3;--line:#f0e4d4;--ok:#2f8f5b}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(900px 420px at 50% -120px,rgba(224,140,70,.22),transparent),var(--bg);padding-bottom:120px}
html[data-font=serif] body{font-family:Georgia,serif}
h1,h2,h3,.verse{font-family:Georgia,"Times New Roman",serif}
h1{font-size:28px;letter-spacing:-.3px}
h2{font-size:23px;margin:14px 0 6px}
.card{border-radius:22px;border-color:transparent;box-shadow:0 2px 6px #00000008,0 14px 34px #0000000e;padding:16px 18px}
.btn{background:linear-gradient(135deg,var(--acc),#e48f4f);border-radius:14px;box-shadow:0 4px 14px #c2703a40}
.btn.ghost{background:none;box-shadow:none}
.chip{border-radius:99px;box-shadow:0 1px 2px #0000000a}
nav{left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));border:0;border-radius:24px;padding:6px;box-shadow:0 10px 34px #00000030}
nav button{border-radius:18px;font-weight:600}
nav button.on{background:linear-gradient(135deg,var(--acc2),transparent)}
.tile{border-radius:22px;border-color:transparent;background:linear-gradient(180deg,var(--card),var(--acc2));padding:24px 8px;box-shadow:0 2px 6px #00000008,0 12px 28px #0000000d;transition:transform .15s}
.tile:active{transform:scale(.96)}
.tile span{font-size:42px}
.bigact{border-radius:22px;border-color:transparent;box-shadow:0 2px 6px #00000008,0 12px 28px #0000000d}
.vcard{border-radius:26px;padding:26px 22px;box-shadow:0 14px 36px #0003}
.toast{bottom:112px}
.poke{background:linear-gradient(135deg,#ff7a59,#ff4f81 55%,#9b5cff);background-size:200% 200%;animation:pg 7s ease infinite;color:#fff;border-radius:28px;padding:20px 16px;margin:14px 0;box-shadow:0 14px 34px #ff4f8150;text-align:center}
.stay{background:linear-gradient(135deg,#2f8f5b,#3d6fb5);color:#fff;border-radius:24px;padding:18px 16px;margin:14px 0;box-shadow:0 10px 28px #3d6fb544}
.stay h3{color:#fff;margin:0 0 2px;font-size:24px}.stay p{margin:0 0 10px;opacity:.95;font-size:15px}
.stay .sbtn{background:#fff;color:#256b8f;border:0;border-radius:99px;padding:13px 20px;font:800 17px system-ui,sans-serif;cursor:pointer;margin:4px 4px 0 0}
.stay .sbtn.o{background:#ffffff26;color:#fff;border:1px solid #fff9}
.stay .streak{font-size:34px;font-weight:800;line-height:1}
.breath{width:130px;height:130px;border-radius:50%;margin:14px auto;background:radial-gradient(circle,#9fd8ff,#3d6fb5);animation:br 8s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(.55);opacity:.6}50%{transform:scale(1.05);opacity:1}}
.poke h3{color:#fff;margin:0 0 2px;font-size:28px}
.poke p{margin:0 0 12px;opacity:.95;font-size:15px}
.pokebtn{background:#fff;color:#e23a6e;border:0;border-radius:99px;padding:15px 26px;font:800 20px system-ui,sans-serif;cursor:pointer;margin:4px;box-shadow:0 5px 0 #0002;animation:wob 2.4s ease-in-out infinite}
.pokebtn:nth-child(2){animation-delay:.5s}
.pokebtn:active{transform:translateY(4px) scale(.97);box-shadow:none}
@keyframes pg{50%{background-position:100% 50%}}
@keyframes wob{0%,100%{transform:rotate(0)}8%{transform:rotate(-5deg) translateX(-4px)}16%{transform:rotate(4deg) translateX(4px)}24%{transform:rotate(0)}}
.fly{position:fixed;left:-70px;z-index:60;pointer-events:none;animation:flyx 2.4s linear forwards}
@keyframes flyx{to{transform:translateX(calc(100vw + 140px)) rotate(25deg)}}
@keyframes flyl{to{transform:translateX(calc(-100vw - 140px)) rotate(-25deg)}}

/* v4.2 calm and gorgeous */
:root{--bg:#fcf9f4;--acc:#bd6b3c;--acc2:#f6e7d6;--line:#f1e6d8}
body{font-size:18px;line-height:1.6}
.hello{font-size:26px;font-weight:700;margin:6px 2px 4px;letter-spacing:-.3px}
.card{border-radius:24px;padding:18px 20px}
.card.gentle{background:color-mix(in srgb,var(--acc) 13%,var(--card));border:1px solid color-mix(in srgb,var(--acc) 30%,var(--line));color:var(--ink)}
.card.gentle b,.card.gentle h3{color:var(--ink)}
.card.gentle .meta{color:var(--mute)}

.card h3{margin:0 0 6px;font-size:21px}
.btn{border-radius:16px;padding:13px 20px;font-size:17px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.trio{gap:12px}
.bigact{padding:22px 6px;font-size:17px;border-radius:24px;transition:transform .12s}
.bigact:active{transform:scale(.96)}
.bigact span{font-size:40px;margin-bottom:4px}
.more>summary{font-size:18px;padding:14px 4px;color:var(--mute)}
.meta{font-size:15px;line-height:1.5}
.streak2{font-size:28px;font-weight:800;color:var(--acc);margin:2px 0}
@media (prefers-reduced-motion:no-preference){.card{animation:fade .35s ease}}

/* v4.5 scenes, motion, polish */
body{background:radial-gradient(900px 420px at 50% -120px,var(--glow,rgba(224,140,70,.22)),transparent),var(--bg)}
html[data-scene=sunrise]{--acc:#d9772b;--glow:rgba(255,150,70,.28);--acc2:#fbe3cb}
html[data-scene=forest]{--acc:#2f8f5b;--glow:rgba(60,170,110,.22);--acc2:#d8eddf}
html[data-scene=ocean]{--acc:#2f78b5;--glow:rgba(70,150,220,.24);--acc2:#d6e8f6}
html[data-scene=lavender]{--acc:#8a4fb5;--glow:rgba(160,110,220,.24);--acc2:#eadcf6}
html[data-scene=rose]{--acc:#c2476b;--glow:rgba(230,110,150,.24);--acc2:#f8dbe4}
.btn{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 78%,#fff));color:#fff}
.btn.ghost{background:transparent;color:var(--acc)}
:root[data-theme=dark] .btn:not(.ghost){color:#2a1b0c}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .btn:not(.ghost){color:#2a1b0c}}
.vcard{background-size:220% 220%;animation:vg 16s ease-in-out infinite}
@keyframes vg{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
:root[data-calm] .vcard{animation:none}
@media (prefers-reduced-motion:reduce){.vcard{animation:none}}
.chip,.btn,.react,.bigact,.pokebtn,.sbtn,nav button{transition:transform .15s ease,box-shadow .2s ease,background .2s ease}
.chip:active,.react:active{transform:scale(.93)}
dialog[open]{animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.hstat{position:absolute;right:66px;top:max(20px,env(safe-area-inset-top));display:flex;gap:8px;align-items:center;font:700 15px system-ui,sans-serif}
.hstat .av{font-size:22px}.hbell{background:var(--acc);color:#fff;border:0;border-radius:99px;padding:5px 10px;font:700 14px system-ui,sans-serif;cursor:pointer}
.agrid{grid-template-columns:repeat(2,1fr);gap:10px}
.agrid figure{margin:0;position:relative;border-radius:18px;overflow:hidden;box-shadow:0 6px 18px #0002}
.agrid figure:first-child{grid-column:span 2}
.agrid figure img{border-radius:0;display:block;width:100%;aspect-ratio:1;object-fit:cover}
.agrid figure:first-child img{aspect-ratio:16/10}
.agrid figcaption{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;color:#fff;font:600 13px system-ui,sans-serif;background:linear-gradient(transparent,#000a)}
#biolock{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#biolock .big{font-size:64px}

/* v4.6 gorgeous pass */
:root{--bg:#fbf7f1;--card:#ffffff;--ink:#2a2530;--mute:#7b7384;--line:#efe5d8;--glow:rgba(224,140,70,.20)}
:root[data-theme=dark]{--bg:#16131b;--card:#211d29;--ink:#f3eee7;--mute:#a9a1b3;--line:#342e3d;--acc2:#3a2f26;--glow:rgba(150,110,220,.16)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#16131b;--card:#211d29;--ink:#f3eee7;--mute:#a9a1b3;--line:#342e3d;--acc2:#3a2f26;--glow:rgba(150,110,220,.16)}}
body{background:radial-gradient(800px 380px at 85% -100px,var(--glow,rgba(224,140,70,.2)),transparent),radial-gradient(700px 420px at 0% 110%,var(--glow,rgba(224,140,70,.14)),transparent),var(--bg);background-attachment:fixed;-webkit-font-smoothing:antialiased}
::selection{background:var(--acc);color:#fff}
header{padding-bottom:10px}
h1{font-size:30px;letter-spacing:-.5px}
h1,h2,h3,.verse,.hello{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.hello{font-size:30px;font-weight:700;letter-spacing:-.4px;margin:10px 2px 6px}
.sub{color:var(--mute);font:15px system-ui,sans-serif}
.card{border-radius:26px;box-shadow:0 1px 2px #0000000a,0 10px 30px #3a2a1a14}
.card:not(.vcard):not(.gentle){background:var(--card);border:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.card.vcard{border:0}
:root[data-theme=dark] .card{box-shadow:0 1px 2px #0006,0 12px 32px #0004}
nav{background:color-mix(in srgb,var(--card) 74%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid color-mix(in srgb,var(--line) 60%,transparent);box-shadow:0 12px 36px #0000002e}
nav button{font-weight:600;letter-spacing:.2px}
nav button.on{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc)}
nav button span{filter:drop-shadow(0 2px 3px #0002)}
.chip{background:color-mix(in srgb,var(--card) 90%,transparent);border-color:color-mix(in srgb,var(--line) 80%,transparent);font-weight:600}
.chip.on{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 70%,#fff));border-color:transparent;box-shadow:0 4px 12px color-mix(in srgb,var(--acc) 35%,transparent)}
input,textarea,select{border-radius:14px;border:1.5px solid var(--line);background:color-mix(in srgb,var(--card) 70%,var(--bg));transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 20%,transparent)}
dialog{border-radius:28px;padding:22px;box-shadow:0 30px 80px #0006;border:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
dialog::backdrop{background:#0009;-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
.poke{background:linear-gradient(135deg,#ff8a5c,#ff4f81 55%,#8f5cff);border-radius:32px;padding:24px 18px;box-shadow:0 18px 44px #ff4f8144,inset 0 1px 0 #ffffff55}
.poke h3{font-size:32px;text-shadow:0 2px 8px #0003}
.pokebtn{font-size:21px;padding:16px 28px}
.stay{background:radial-gradient(500px 220px at 90% 0%,#7fd6a455,transparent),linear-gradient(135deg,#2a8a5a,#2f6fa8 70%,#3d5db5);border-radius:30px;padding:22px 18px;box-shadow:0 16px 40px #2f6fa840,inset 0 1px 0 #ffffff44}
.stay .streak{font-family:"Iowan Old Style",Georgia,serif;font-size:38px;letter-spacing:-.5px}
.vcard{border-radius:30px;padding:28px 22px 22px;position:relative;overflow:hidden;box-shadow:0 18px 44px #1a2a5a40}
.vcard::before{content:"\201C";position:absolute;top:-18px;left:12px;font:140px/1 Georgia,serif;color:#fff;opacity:.16;pointer-events:none}
.vcard .verse{font-style:italic;font-size:25px;line-height:1.42;position:relative}
.tile{border-radius:26px;font-weight:700}
.tile span,.bigact span{filter:drop-shadow(0 4px 6px #0002)}
.bigact{background:var(--card);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:28px;box-shadow:0 2px 4px #0000000a,0 14px 30px #3a2a1a12;font-weight:700}
.more>summary{border-radius:20px;background:color-mix(in srgb,var(--card) 85%,transparent);color:var(--mute)}
.who{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc);font-weight:700}
.bub{border-radius:20px;border-color:transparent;box-shadow:0 2px 8px #0000000d}
.bub.me{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 70%,#fff));color:#fff}
.bub.me small{color:#ffffffcc}
.help{box-shadow:0 8px 20px color-mix(in srgb,var(--acc) 45%,transparent)}
.hbtn{box-shadow:0 4px 14px #0000001f}
.banner{border-radius:16px}
.empty{font-style:italic}

.tlist{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.trow{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:12px 16px 12px 12px;border-radius:24px;background:var(--card);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);color:var(--ink);cursor:pointer;box-shadow:0 2px 4px #0000000a,0 10px 24px #3a2a1a10;font-family:system-ui,sans-serif}
.trow:active{transform:scale(.98)}
.trow .ti{flex:0 0 54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:30px;background:color-mix(in srgb,var(--c) 18%,var(--card));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 30%,transparent)}
.trow .tx{flex:1;min-width:0}
.trow b{display:block;font-size:18px;font-family:"Iowan Old Style",Georgia,serif}
.trow small{display:block;color:var(--mute);font-size:14px;line-height:1.35;margin-top:2px}
.trow .ch{color:var(--mute);font-size:26px}

details.fold{margin:14px 0;border-radius:28px;background:color-mix(in srgb,var(--card) 55%,transparent);border:1px solid color-mix(in srgb,var(--line) 80%,transparent);padding:0 8px 8px}
details.fold>summary{list-style:none;cursor:pointer;padding:18px 14px;font:700 19px "Iowan Old Style",Georgia,serif;display:flex;align-items:center;justify-content:space-between}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"›";font:400 28px system-ui;color:var(--mute);transition:transform .2s}
details.fold[open]>summary::after{transform:rotate(90deg)}
details.fold>.card{box-shadow:none;margin:8px 0}

main>h2{font-size:29px;letter-spacing:-.3px}
main>h2::after{content:"";display:block;width:46px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:7px}
.tvhero{background:radial-gradient(420px 200px at 90% 0%,#ffffff33,transparent),linear-gradient(135deg,#6b4fd8,#c2476b 60%,#ee8a4a);color:#fff;border-radius:30px;padding:24px 20px;margin:12px 0;box-shadow:0 16px 40px #6b4fd844,inset 0 1px 0 #ffffff55;font:16px/1.5 system-ui,sans-serif}
.tvbig{font:800 38px/1.1 "Iowan Old Style",Georgia,serif;margin-bottom:6px}
.pill{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc);font:700 14px system-ui,sans-serif;padding:7px 14px;border-radius:99px}
.pbar{height:10px;border-radius:99px;background:color-mix(in srgb,var(--line) 90%,transparent);overflow:hidden;margin:12px 0 8px}
.pbar span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#fff));transition:width .35s ease}
.tvq h3{font-size:24px;line-height:1.3;margin:0 0 12px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:8px 0;padding:14px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 17px system-ui,sans-serif;cursor:pointer;transition:transform .12s,border-color .15s,background .15s}
.opt:active{transform:scale(.98)}
.opt .ltr{flex:0 0 34px;height:34px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc);font-weight:800}
.opt .mk{margin-left:auto;font-weight:800;font-size:20px}
.opt.good{border-color:#2f8f5b;background:color-mix(in srgb,#2f8f5b 16%,var(--card))}
.opt.good .ltr{background:#2f8f5b;color:#fff}
.opt.bad{border-color:#c0392b;background:color-mix(in srgb,#c0392b 14%,var(--card))}
.opt.bad .ltr{background:#c0392b;color:#fff}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
.card a:not(.btn){color:var(--acc);font-weight:600}
.fabadd{bottom:calc(140px + env(safe-area-inset-bottom));font-size:26px}
@media print{body>*:not(dialog){display:none!important}dialog{position:static!important;box-shadow:none!important;border:0!important;width:auto!important;max-width:none!important}.row{display:none!important}}
.compact .card{padding:10px 14px;margin:8px 0}
.compact .card .row:has(.react){display:none}
details.fold.mini{margin:8px 0}
details.fold.mini>summary{font:700 16px system-ui,sans-serif;padding:12px 12px}
</style>

/* ---------- toast + notify ---------- */
function toast(msg,undoLabel,undoFn){
  const box=$("toastbox");
  box.innerHTML=`<div class="toast"><span>${esc(msg)}</span>${undoLabel?`<button id="tundo">${esc(undoLabel)}</button>`:""}</div>`;
  if(undoLabel){$("tundo").onclick=()=>{box.innerHTML="";undoFn&&undoFn();};}
  clearTimeout(toast.t);toast.t=setTimeout(()=>{box.innerHTML=""},undoLabel?7000:3500);
}
function notify(title,body){
  toast(body);
  try{
    if("Notification" in window && Notification.permission==="granted" && navigator.serviceWorker){
      navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,icon:"icon-192.png"})).catch(()=>{});
    }
  }catch(e){}
}

/* ---------- bible text ---------- */
async function bibleFetch(ref){
  const k="fh_b_"+ver+"_"+ref;
  try{const c=localStorage.getItem(k);if(c)return JSON.parse(c);}catch(e){}
  if(ver==="esv"&&ESV_KEY){
    const er=await fetch("https://api.esv.org/v3/passage/text/?q="+encodeURIComponent(ref)+"&include-headings=false&include-footnotes=false&include-short-copyright=false&include-passage-references=false&include-verse-numbers=true",{headers:{Authorization:"Token "+ESV_KEY}});
    const ej=await er.json();
    if(ej&&ej.passages&&ej.passages[0]){
      const raw=ej.passages[0],nums=[];raw.replace(/\[(\d+)\]/g,(m,n)=>{nums.push(Number(n));return m;});
      const o={ref:(ej.canonical||ref)+" (ESV)",text:raw.replace(/\[\d+\]/g," ").replace(/\s+/g," ").trim(),verses:nums};
      try{localStorage.setItem(k,JSON.stringify(o));}catch(e){}
      return o;
    }
    throw new Error("not found");
  }
  const r=await fetch("https://bible-api.com/"+encodeURIComponent(ref)+"?translation="+(ver==="esv"?"web":ver));
  const j=await r.json();
  if(j&&j.text){
    const o={ref:j.reference||ref,text:j.text.trim().replace(/\s*\n\s*/g," "),verses:(j.verses||[]).map(v=>v.verse)};
    try{localStorage.setItem(k,JSON.stringify(o));}catch(e){}
    return o;
  }
  throw new Error("not found");
}
let daily=null;

  try{const r=await bibleFetch(ref);daily={ref:r.ref,text:r.text};}catch(e){daily=DEFAULTS[dayNum()%DEFAULTS.length];}
  render();
}

function save(it,noPing){
  if(db){
    const {id,...rest}=it;
    rest.audience=(rest.audience&&rest.author&&rest.author!==me)?rest.audience:audOf(rest);
    const p=id?db.collection("items").doc(id).set(rest,{merge:true}):db.collection("items").add(rest);
    p.catch(()=>toast("Could not save. Check your connection."));
    if(!id&&!noPing&&rest.type!=="journal"&&me){
      const to=PEOPLE.filter(x=>x!==me&&(rest.audience||[]).includes(lc(x)));
      if(to.length){const S=SECTIONS[rest.type];
        if(rest.type==="msg")sendPing(to,rest.text,"chat");
        else if(rest.type==="prayer")sendPing(to,rest.text,"prayer");
        else sendPing(to,"added to "+(S?S.label:"the hub"),"activity");}
    }
  } else {
    if(it.id){items=items.map(x=>x.id===it.id?it:x);}else{it.id=String(Date.now());items.unshift(it);}
    persist();render();
  }
}

function del(id){
  const it=items.find(x=>x.id===id);if(!it)return;
  const {id:_,...rest}=it;
  if(db)db.collection("items").doc(id).delete().catch(()=>{});
  else{items=items.filter(x=>x.id!==id);persist();render();}
  toast("Deleted","Undo",()=>{
    if(db)db.collection("items").doc(id).set(rest).catch(()=>{});
    else{items.unshift(it);persist();render();}
  });
}

/* ---------- push notifications ---------- */
async function ensureToken(show){
  try{
    const reg=await navigator.serviceWorker.ready;
    const m=firebase.messaging();
    const token=await m.getToken({vapidKey:VAPID_KEY,serviceWorkerRegistration:reg});
    if(token){
      await db.collection("tokens").doc(token).set({user:me||"Someone",ts:Date.now(),ua:navigator.userAgent.slice(0,100)},{merge:true});
      localStorage.setItem("fh_push","1");
      if(show)toast("Daily notifications are on 🔔");
      render();
    }
    m.onMessage(p=>{const n=p.notification||{};toast((n.title?n.title+": ":"")+(n.body||""));});
  }catch(e){if(show)toast("Could not turn on notifications on this device");}
}
async function enablePush(){
  if(!("Notification" in window)||!("serviceWorker" in navigator)||!window.firebase||!db){toast("Notifications are not supported here. On iPhone, add the app to your Home Screen first.");return;}
  const p=await Notification.requestPermission();
  if(p!=="granted"){toast("Notifications are off. You can change this in your phone settings.");return;}
  await ensureToken(true);
}

function wrapLines(g,text,maxW){

  for(const w of words){const t=cur?cur+" "+w:w;if(g.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}

}

async function geocode(name){

  if(!j.results||!j.results[0])throw new Error("nf");const x=j.results[0];

async function forecast(lat,lon){
  const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&temperature_unit=fahrenheit&timezone=auto&forecast_days=16`);

}
const tm=s=>{try{return new Date(s).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});}catch(e){return s;}};
function moonPhase(d=new Date()){

}

const SCENES={dusk:"Dusk",forest:"Forest",ocean:"Ocean",sunrise:"Sunrise",night:"Night sky",classic:"Classic"};
function hill(g,W,H,y,amp,col,ph){g.fillStyle=col;g.beginPath();g.moveTo(0,H);for(let x=0;x<=W;x+=20)g.lineTo(x,y+Math.sin(x/W*Math.PI*2+ph)*amp+Math.sin(x/W*Math.PI*5+ph)*amp*.4);g.lineTo(W,H);g.closePath();g.fill();}
function drawVerse(c,ref,text,s){
  const g=c.getContext&&c.getContext("2d");if(!g)return;
  const W=1080,H=1350,P={dusk:["#3b2a5c","#b5547a","#f0a35e"],forest:["#173a2e","#2f6b4f","#8dbb7a"],ocean:["#0f3057","#2b78a8","#8ed1e0"],sunrise:["#7a3e5c","#e0795a","#f6c56b"],night:["#0b1026","#27285a","#4b4a8a"],classic:["#1c1a1f","#33281d","#4a3523"]}[s]||["#1c1a1f","#33281d","#4a3523"];
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,P[0]);gr.addColorStop(.6,P[1]);gr.addColorStop(1,P[2]);g.fillStyle=gr;g.fillRect(0,0,W,H);
  if(s==="dusk"||s==="sunrise"){g.fillStyle="rgba(255,235,190,.85)";g.beginPath();g.arc(540,1010,130,0,Math.PI*2);g.fill();hill(g,W,H,1120,40,"rgba(30,20,40,.85)",1);hill(g,W,H,1200,30,"rgba(15,10,25,.95)",3);}
  else if(s==="forest"){hill(g,W,H,1100,50,"rgba(20,60,45,.9)",0);hill(g,W,H,1200,40,"rgba(10,40,30,.95)",2);g.fillStyle="rgba(8,30,22,.95)";for(let x=40;x<W;x+=90){const h=90+((x*7)%60);g.beginPath();g.moveTo(x,1350);g.lineTo(x+35,1350-h);g.lineTo(x+70,1350);g.fill();}}
  else if(s==="ocean"){for(let k=0;k<5;k++)hill(g,W,H,1000+k*70,24,`rgba(${20+k*10},${70+k*15},${120+k*15},.7)`,k);}
  else if(s==="night"){g.fillStyle="#fff";for(let k=0;k<90;k++){const x=(k*137)%W,y=(k*263)%900,r=(k%3)+1;g.globalAlpha=.4+(k%5)/10;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();}g.globalAlpha=1;g.fillStyle="rgba(250,245,220,.9)";g.beginPath();g.arc(880,230,70,0,Math.PI*2);g.fill();hill(g,W,H,1230,30,"rgba(5,8,20,.95)",1);}
  g.shadowColor="rgba(0,0,0,.55)";g.shadowBlur=14;g.textAlign="center";g.fillStyle="#ffd9a0";g.font="bold 40px sans-serif";g.fillText("VERSE OF THE DAY",540,150);
  let size=64,lines=[];
  for(;size>=30;size-=2){g.font=`italic ${size}px Georgia, serif`;lines=wrapLines(g,"“"+text+"”",880);if(lines.length*size*1.4<=800)break;}
  g.fillStyle="#fff";const top=Math.max(280,640-lines.length*size*0.7);
  lines.forEach((l,i)=>g.fillText(l,540,top+i*size*1.4));
  g.fillStyle="#ffd9a0";g.font="bold 48px sans-serif";g.fillText(ref,540,Math.min(1060,top+lines.length*size*1.4+90));
  g.shadowBlur=0;g.fillStyle="rgba(255,255,255,.75)";g.font="30px sans-serif";g.fillText("Faith Hub",540,1300);
}

  else if(a==="tellprayend"){const t=($("tpt").value||"").trim();if(!t){toast("Write something first");return;}const dn=repliedSet();dn.push(d.id);localStorage.setItem("fh_replied",JSON.stringify(dn.slice(-40)));save({type:"prayer",text:t,for:"Prayer request",cat:"Friends",author:me,created:Date.now(),vis:[me,d.p]},true);sendPing([d.p],t,"prayer");closeDlg();toast("Sent 🙏");render();}
  else if(a==="answersave"){const it2=items.find(x=>x.id===d.id);if(it2){save({...it2,answered:true,answer:($("ans").value||"").trim()});confetti();}closeDlg();}
  else if(a==="chatrec")chatRec();
  else if(a==="bioon")bioEnable();
  else if(a==="bioff"){localStorage.removeItem("fh_bio");toast("Lock is off");render();}
  else if(a==="whydlg")whyDlg();
  else if(a==="whysave")whySave();
  else if(a==="weeklydlg")weeklyDlg();
  else if(a==="weeklysave")weeklySave();
  else if(a==="memtest")memTest();
  else if(a==="memshow"){$("mans").style.display="block";}
  else if(a==="goodnight"){const o=PEOPLE.filter(p=>p!==me);sendPing(o,"Goodnight. Praying for you tonight.","goodnight").then(()=>toast("Goodnight sent 🌙"));}
  else if(a==="seenmissed"){localStorage.setItem("fh_seenmissed",String(Date.now()));render();}
  else if(a==="goodnews")goodNewsDlg();
  else if(a==="gnsend"){const t=($("gnt").value||"").trim(),to=[...document.querySelectorAll(".gnto")].filter(x=>x.checked).map(x=>x.value);if(!t||!to.length){toast("Write something and pick someone");return;}sendPing(to,t,"goodnews").then(()=>{closeDlg();confetti();toast("Sent 🎉");});}
  else if(a==="replacedlg")replaceDlg();
  else if(a==="replacesave")replaceSave();
  else if(a==="strongsos")strongSos();
  else if(a==="strongok"){const was=strongLog()[ymd(new Date())]==="strong",n=strongStreak()+(was?0:1);strongLogSave("Stayed strong");closeDlg();confetti();toast(!was&&BADGES.includes(n)?"🏅 "+n+" days strong!":"Great job. Keep going 💪");render();}
  else if(a==="strongfell")strongFell();
  else if(a==="strongtell"){sendPing([d.p],d.k==="fell"?"could use a prayer today":"wants to talk","support").then(()=>{closeDlg();toast(d.p+" has been notified 💛");});}
  else if(a==="close")closeDlg();
});
window.addEventListener("error",e=>{if(db&&errCount++<5)db.collection("errors").add({msg:String(e.message).slice(0,200),line:e.lineno||0,from:me||"?",ts:Date.now(),v:APP_VER}).catch(()=>{});});
window.addEventListener("unhandledrejection",e=>{if(db&&errCount++<5)db.collection("errors").add({msg:String(e.reason&&e.reason.message||e.reason).slice(0,200),from:me||"?",ts:Date.now(),v:APP_VER}).catch(()=>{});});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
setTimeout(bioShow,0);
start();
</script>
