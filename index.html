/* v4.1 polish */
:root{--bg:#fbf7f1;--acc:#c2703a;--acc2:#f7e6d3;--line:#f0e4d4;--ok:#2f8f5b}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(900px 420px at 50% -120px,rgba(224,140,70,.22),transparent),var(--bg);padding-bottom:120px}

h1,h2,h3,.verse{font-family:Georgia,"Times New Roman",serif}
h1{font-size:28px;letter-spacing:-.3px}
h2{font-size:23px;margin:14px 0 6px}
.card{border-radius:22px;border-color:transparent;box-shadow:0 2px 6px #00000008,0 14px 34px #0000000e;padding:16px 18px}

.tile{border-radius:22px;border-color:transparent;background:linear-gradient(180deg,var(--card),var(--acc2));padding:24px 8px;box-shadow:0 2px 6px #00000008,0 12px 28px #0000000d;transition:transform .15s}
.tile:active{transform:scale(.96)}
.tile span{font-size:42px}
.bigact{border-radius:22px;border-color:transparent;box-shadow:0 2px 6px #00000008,0 12px 28px #0000000d}
.vcard{border-radius:26px;padding:26px 22px;box-shadow:0 14px 36px #0003}
.toast{bottom:112px}
.poke{background:linear-gradient(135deg,#ff7a59,#ff4f81 55%,#9b5cff);background-size:200% 200%;animation:pg 7s ease infinite;color:#fff;border-radius:28px;padding:20px 16px;margin:14px 0;box-shadow:0 14px 34px #ff4f8150;text-align:center}
.stay{background:linear-gradient(135deg,#2f8f5b,#3d6fb5);color:#fff;border-radius:24px;padding:18px 16px;margin:14px 0;box-shadow:0 10px 28px #3d6fb544}
.stay h3{color:#fff;margin:0 0 2px;font-size:24px}.stay p{margin:0 0 10px;opacity:.95;font-size:15px}
.stay .sbtn{background:#fff;color:#256b8f;border:0;border-radius:99px;padding:13px 20px;font:800 17px system-ui,sans-serif;cursor:pointer;margin:4px 4px 0 0}
.stay .sbtn.o{background:#ffffff26;color:#fff;border:1px solid #fff9}
.stay .streak{font-size:34px;font-weight:800;line-height:1}
.breath{width:130px;height:130px;border-radius:50%;margin:14px auto;background:radial-gradient(circle,#9fd8ff,#3d6fb5);animation:br 8s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(.55);opacity:.6}50%{transform:scale(1.05);opacity:1}}
.poke h3{color:#fff;margin:0 0 2px;font-size:28px}
.poke p{margin:0 0 12px;opacity:.95;font-size:15px}
.pokebtn{background:#fff;color:#e23a6e;border:0;border-radius:99px;padding:15px 26px;font:800 20px system-ui,sans-serif;cursor:pointer;margin:4px;box-shadow:0 5px 0 #0002;animation:wob 2.4s ease-in-out infinite}
.pokebtn:nth-child(2){animation-delay:.5s}

@keyframes pg{50%{background-position:100% 50%}}
@keyframes wob{0%,100%{transform:rotate(0)}8%{transform:rotate(-5deg) translateX(-4px)}16%{transform:rotate(4deg) translateX(4px)}24%{transform:rotate(0)}}

/* v4.2 calm and gorgeous */
:root{--bg:#fcf9f4;--acc:#bd6b3c;--acc2:#f6e7d6;--line:#f1e6d8}

 {c:"New Testament",q:"Who baptized Jesus?",o:["Peter","John the Baptist","Andrew"],a:1,r:"Matthew 3:13",e:"The Spirit descended like a dove and a voice said, 'This is my beloved Son.'"},
 {c:"Jesus",q:"Where was Jesus born?",o:["Nazareth","Jerusalem","Bethlehem"],a:2,r:"Luke 2:4",e:"Joseph and Mary traveled there for the census. The prophet Micah had named Bethlehem 700 years earlier."},
 {c:"Jesus",q:"In which town did Jesus grow up?",o:["Capernaum","Nazareth","Jericho"],a:1,r:"Luke 4:16",e:"He worked as a carpenter's son and later taught in the synagogue there."},
 {c:"Jesus",q:"How many days did Jesus fast in the wilderness?",o:["7","40","100"],a:1,r:"Matthew 4:2",e:"After fasting, he answered each temptation by quoting Scripture. We can do the same."},
 {c:"Jesus",q:"What did Jesus call the greatest commandment?",o:["Keep the Sabbath","Love the Lord your God with all your heart","Give a tenth"],a:1,r:"Matthew 22:37",e:"The second is like it: love your neighbor as yourself. He said all the Law and the Prophets hang on these two."},
 {c:"Jesus",q:"Who first heard the angels announce Jesus' birth?",o:["Kings","Shepherds","Priests"],a:1,r:"Luke 2:8",e:"They were ordinary workers watching sheep at night. God chose to tell them first."},
 {c:"Jesus",q:"On what animal did Jesus ride into Jerusalem?",o:["A horse","A camel","A donkey"],a:2,r:"Matthew 21:7",e:"The crowd laid palm branches and shouted 'Hosanna.' It fulfilled the prophecy in Zechariah 9:9."},
 {c:"Jesus",q:"On which day did Jesus rise from the dead?",o:["The first day","The third day","The seventh day"],a:1,r:"1 Corinthians 15:4",e:"The women found the tomb empty early on the first day of the week. We celebrate this on Easter."},
 {c:"Jesus",q:"What did Jesus do for his disciples in a storm on the lake?",o:["Told them to row harder","Calmed the wind and waves","Walked away"],a:1,r:"Mark 4:39",e:"He said, 'Peace! Be still!' and the wind stopped. The disciples asked, 'Who is this?'"},
 {c:"Places",q:"In which river was Jesus baptized?",o:["Nile","Jordan","Euphrates"],a:1,r:"Matthew 3:13",e:"The Jordan River also marks where Israel entered the Promised Land."},
 {c:"Places",q:"On which mountain did Moses receive the Ten Commandments?",o:["Mount Sinai","Mount Zion","Mount Carmel"],a:0,r:"Exodus 19:20",e:"God gave the Law there after leading Israel out of Egypt."},
 {c:"Places",q:"Where did Noah's ark come to rest?",o:["Mount Ararat","Mount Sinai","Mount of Olives"],a:0,r:"Genesis 8:4",e:"The ark rested on the mountains of Ararat in the seventh month."},
 {c:"Places",q:"In which garden did Jesus pray before his arrest?",o:["Eden","Gethsemane","Carmel"],a:1,r:"Matthew 26:36",e:"He prayed, 'Not my will, but yours be done.' Gethsemane means 'olive press'."},
 {c:"Places",q:"Where did Adam and Eve first live?",o:["Garden of Eden","Mount Moriah","Canaan"],a:0,r:"Genesis 2:8",e:"God planted the garden and placed the man there to work it and keep it."},
 {c:"Books of the Bible",q:"How many books are in the Bible?",o:["39","66","72"],a:1,r:"The whole Bible",e:"There are 39 books in the Old Testament and 27 in the New Testament."},
 {c:"Books of the Bible",q:"What is the first book of the Bible?",o:["Exodus","Genesis","Psalms"],a:1,r:"Genesis 1:1",e:"Genesis means 'beginning'. It opens with 'In the beginning, God created the heavens and the earth.'"},
 {c:"Books of the Bible",q:"What is the last book of the Bible?",o:["Jude","Acts","Revelation"],a:2,r:"Revelation 1:1",e:"Revelation was written by John and ends with the promise that Jesus is coming."},
 {c:"Books of the Bible",q:"Which book has the most chapters?",o:["Psalms","Isaiah","Genesis"],a:0,r:"Psalms",e:"Psalms has 150 chapters. It is the Bible's songbook and prayer book."},
 {c:"Books of the Bible",q:"Which is the shortest verse in the English Bible?",o:["Psalm 23:1","John 11:35","Genesis 1:1"],a:1,r:"John 11:35",e:"'Jesus wept.' He cried with Mary and Martha before raising Lazarus."},
 {c:"Books of the Bible",q:"Who wrote most of the book of Proverbs?",o:["David","Solomon","Paul"],a:1,r:"Proverbs 1:1",e:"Solomon's proverbs give wisdom for daily life. It begins 'The fear of the Lord is the beginning of knowledge.'"},
 {c:"People",q:"Who was the first woman?",o:["Eve","Sarah","Mary"],a:0,r:"Genesis 3:20",e:"God made Eve from Adam's side to be his helper. Her name means 'living'."},
 {c:"People",q:"Who was the mother of Jesus?",o:["Mary","Martha","Elizabeth"],a:0,r:"Luke 1:30",e:"The angel Gabriel told her, 'You have found favor with God.' She answered, 'Let it be to me according to your word.'"},
 {c:"People",q:"Who spoke for Moses to Pharaoh?",o:["Aaron","Caleb","Joshua"],a:0,r:"Exodus 4:14",e:"Moses felt he could not speak well, so God sent his brother Aaron to help."},
 {c:"People",q:"Who wrote most of the New Testament letters?",o:["Peter","Paul","John"],a:1,r:"Romans 1:1",e:"Paul wrote 13 letters, many from prison. They encouraged the early churches."}
];
QUIZ.push(
 {c:"Parables",q:"In the parable of the lost sheep, how many sheep did the shepherd leave to find the one?",o:["9","99","50"],a:1,r:"Luke 15:4",e:"Jesus said there is more joy in heaven over one sinner who repents than over 99 who do not need to."},
 {c:"Parables",q:"In the story of the prodigal son, what did the father do when he saw his son coming home?",o:["He waited at the door","He ran and hugged him","He sent a servant"],a:1,r:"Luke 15:20",e:"The father was filled with compassion. He gave his son a robe, a ring and a feast. It pictures how God welcomes us."},
 {c:"Parables",q:"In the parable of the sower, how much grain did the good soil produce?",o:["Ten times","Thirty, sixty or a hundred times","Nothing"],a:1,r:"Matthew 13:8",e:"The seed is God's word. Good soil stands for a heart that hears it and understands."},
 {c:"Parables",q:"In the story of the Good Samaritan, who stopped to help the wounded man?",o:["A priest","A Levite","A Samaritan"],a:2,r:"Luke 10:33",e:"Jews and Samaritans were enemies, yet the Samaritan showed mercy. Jesus said, 'Go and do likewise.'"},
 {c:"Parables",q:"What did the wise man build his house on?",o:["Sand","Rock","Wood"],a:1,r:"Matthew 7:24",e:"Hearing Jesus' words and doing them is like building on rock. The storms came, but the house stood."},
 {c:"Parables",q:"What did Jesus compare to a tiny mustard seed?",o:["The kingdom of heaven","The temple","The law"],a:0,r:"Matthew 13:31",e:"It starts as the smallest of seeds and grows into a tree where birds can rest."},
 {c:"Parables",q:"In the parable of the ten virgins, what did the wise ones bring extra?",o:["Bread","Oil for their lamps","Water"],a:1,r:"Matthew 25:4",e:"The story reminds us to be ready for Jesus' return."},
 {c:"Parables",q:"What did the servant with one talent do with it?",o:["Invested it","Gave it away","Buried it in the ground"],a:2,r:"Matthew 25:25",e:"He was afraid. The master wanted him to use what he was given, not hide it."},
 {c:"Parables",q:"In the parable of the lost coin, how many coins did the woman have?",o:["Five","Ten","Twelve"],a:1,r:"Luke 15:8",e:"She lit a lamp and swept the house until she found the coin, then called her friends to celebrate."},
 {c:"Parables",q:"In the story of the Pharisee and the tax collector, who went home right with God?",o:["The Pharisee","The tax collector","Both of them"],a:1,r:"Luke 18:14",e:"The tax collector humbly prayed, 'God, be merciful to me, a sinner.' Jesus said the humble will be lifted up."},
 {c:"Parables",q:"What did the rich fool plan to do with his big harvest?",o:["Give to the poor","Build bigger barns","Sell it all"],a:1,r:"Luke 12:18",e:"God called him a fool because that very night his life was required of him. Life is more than possessions."},

 {c:"Miracles",q:"What did Jesus walk on?",o:["Water","Fire","Clouds"],a:0,r:"Matthew 14:25",e:"The disciples thought he was a ghost. Peter stepped out of the boat too, until he looked at the waves and began to sink."},
 {c:"Miracles",q:"How many baskets of leftovers were gathered after feeding the 5,000?",o:["Seven","Twelve","Three"],a:1,r:"Matthew 14:20",e:"One basket for each of the twelve disciples. There was more left over than they began with."},
 {c:"Miracles",q:"Who was healed after touching the edge of Jesus' cloak?",o:["A woman who had bled for twelve years","A soldier's servant","A blind beggar"],a:0,r:"Luke 8:44",e:"Jesus said, 'Daughter, your faith has made you well. Go in peace.'"},
 {c:"Miracles",q:"Which blind man shouted, 'Son of David, have mercy on me!'?",o:["Bartimaeus","Nicodemus","Lazarus"],a:0,r:"Mark 10:47",e:"People told him to be quiet, but he cried out louder. Jesus stopped and healed him."},
 {c:"Miracles",q:"How did Jesus heal the man born blind in John 9?",o:["With mud made from spit, then washing in a pool","By a word from far away","By touching his ears"],a:0,r:"John 9:6",e:"The man washed in the Pool of Siloam and could see. He told everyone, 'One thing I know: I was blind, and now I see.'"},
 {c:"Miracles",q:"How long had the man at the pool of Bethesda been sick?",o:["12 years","38 years","7 years"],a:1,r:"John 5:5",e:"Jesus asked, 'Do you want to be healed?' then told him to pick up his mat and walk."},
 {c:"Miracles",q:"Of the ten lepers Jesus healed, how many came back to say thank you?",o:["One","Three","All ten"],a:0,r:"Luke 17:15",e:"The one who returned was a Samaritan. Jesus asked, 'Where are the other nine?'"},
 {c:"Miracles",q:"Which prophet made an iron axe head float?",o:["Elisha","Isaiah","Amos"],a:0,r:"2 Kings 6:6",e:"A borrowed axe head fell into the Jordan. Elisha threw in a stick and the iron floated."},
 {c:"Miracles",q:"What fell from heaven on Mount Carmel when Elijah prayed?",o:["Rain","Fire","Manna"],a:1,r:"1 Kings 18:38",e:"The fire burned up the sacrifice, the wood and even the water. The people cried, 'The Lord, he is God!'"},
 {c:"Miracles",q:"What did the sun do when Joshua prayed during battle?",o:["It stood still","It turned dark","It moved backward"],a:0,r:"Joshua 10:13",e:"There has never been another day like it, when the Lord listened to the voice of a man."},
 {c:"Miracles",q:"What did Moses do to bring water from a rock?",o:["Prayed all night","Struck it with his staff","Dug with his hands"],a:1,r:"Exodus 17:6",e:"God stood before him on the rock at Horeb. The people drank and were satisfied."},

 {c:"Psalms and Wisdom",q:"Psalm 23 begins, 'The Lord is my...'",o:["Shepherd","Fortress","King"],a:0,r:"Psalm 23:1",e:"'I shall not want.' It is one of the best loved passages in the Bible."},
 {c:"Psalms and Wisdom",q:"Who wrote most of the Psalms?",o:["Moses","David","Solomon"],a:1,r:"Psalms",e:"David is credited with about 73 psalms. Others were written by Asaph, the sons of Korah, Solomon and Moses."},
 {c:"Psalms and Wisdom",q:"Which is the longest chapter in the Bible?",o:["Psalm 23","Psalm 119","Isaiah 53"],a:1,r:"Psalm 119",e:"It has 176 verses and praises God's word."},
 {c:"Psalms and Wisdom",q:"'Your word is a lamp to my feet and a light to my...'",o:["Path","Eyes","Heart"],a:0,r:"Psalm 119:105",e:"God's word shows us the next step, even when we cannot see far ahead."},
 {c:"Psalms and Wisdom",q:"Which book says, 'Trust in the Lord with all your heart'?",o:["Proverbs","Psalms","Isaiah"],a:0,r:"Proverbs 3:5",e:"The verse continues, 'and lean not on your own understanding. In all your ways acknowledge him, and he will make straight your paths.'"},
 {c:"Psalms and Wisdom",q:"Which book says, 'There is a time for everything'?",o:["Job","Ecclesiastes","Song of Songs"],a:1,r:"Ecclesiastes 3:1",e:"It lists a time to be born and to die, to weep and to laugh, to mourn and to dance."},
 {c:"Psalms and Wisdom",q:"Which man lost everything yet stayed faithful to God?",o:["Job","Jonah","Hosea"],a:0,r:"Job 1:21",e:"Job said, 'The Lord gave and the Lord has taken away; blessed be the name of the Lord.' God later restored him."},
 {c:"Psalms and Wisdom",q:"According to Proverbs, what does a gentle answer do?",o:["Turns away anger","Starts a debate","Makes people proud"],a:0,r:"Proverbs 15:1",e:"'But a harsh word stirs up anger.' Kind words can calm a hard moment."},
 {c:"Psalms and Wisdom",q:"Psalm 46:10 says, 'Be still, and know that I am...'",o:["God","near","the way"],a:0,r:"Psalm 46:10",e:"It is an invitation to stop striving and rest in God's power."},
 {c:"Psalms and Wisdom",q:"Which psalm begins, 'The heavens declare the glory of God'?",o:["Psalm 8","Psalm 19","Psalm 100"],a:1,r:"Psalm 19:1",e:"Creation speaks about its maker day after day without words."},

 {c:"Prophets",q:"Which prophet saw a valley of dry bones come to life?",o:["Ezekiel","Daniel","Hosea"],a:0,r:"Ezekiel 37:1",e:"God showed that he could restore Israel just as he gave breath to the bones."},
 {c:"Prophets",q:"Which prophet said, 'Here am I. Send me!'?",o:["Isaiah","Micah","Joel"],a:0,r:"Isaiah 6:8",e:"Isaiah saw the Lord high and lifted up and a seraph touched his lips with a coal."},
 {c:"Prophets",q:"Which prophet is known as the weeping prophet?",o:["Jeremiah","Amos","Nahum"],a:0,r:"Jeremiah 9:1",e:"Jeremiah grieved over his people's sin and warned of Babylon."},
 {c:"Prophets",q:"Which prophet confronted King David and said, 'You are the man!'?",o:["Nathan","Samuel","Gad"],a:0,r:"2 Samuel 12:7",e:"Nathan used a story about a stolen lamb. David confessed, and wrote Psalm 51."},
 {c:"Prophets",q:"Which prophet anointed David as king?",o:["Samuel","Elijah","Nathan"],a:0,r:"1 Samuel 16:13",e:"David was the youngest son, out with the sheep. God looks at the heart."},
 {c:"Prophets",q:"Which prophet was fed by ravens?",o:["Elijah","Elisha","Jonah"],a:0,r:"1 Kings 17:6",e:"God sent ravens with bread and meat each morning and evening by the brook Cherith."},
 {c:"Prophets",q:"Who became prophet after Elijah?",o:["Elisha","Hosea","Gehazi"],a:0,r:"2 Kings 2:15",e:"Elisha asked for a double portion of Elijah's spirit and received it."},
 {c:"Prophets",q:"Which prophet said a virgin would conceive and bear a son named Immanuel?",o:["Isaiah","Zechariah","Malachi"],a:0,r:"Isaiah 7:14",e:"Immanuel means 'God with us.' Matthew 1:23 connects it to Jesus."},
 {c:"Prophets",q:"Which Old Testament book is the last one?",o:["Malachi","Zechariah","Nehemiah"],a:0,r:"Malachi 1:1",e:"Malachi ends the Old Testament and points ahead to the coming messenger."},
 {c:"Prophets",q:"Which prophet was a shepherd and farmer from Tekoa?",o:["Amos","Micah","Joel"],a:0,r:"Amos 7:14",e:"Amos was not from a family of prophets, but God called him to speak for justice."},

 {c:"Apostles and Paul",q:"Which apostle was a fisherman and Andrew's brother?",o:["Peter","John","Philip"],a:0,r:"Matthew 4:18",e:"Jesus said, 'Follow me, and I will make you fishers of men.' They left their nets at once."},
 {c:"Apostles and Paul",q:"Which disciple was a tax collector?",o:["Matthew","Thomas","Bartholomew"],a:0,r:"Matthew 9:9",e:"Matthew, also called Levi, got up and followed Jesus. He wrote the first Gospel."},
 {c:"Apostles and Paul",q:"Who replaced Judas as the twelfth apostle?",o:["Matthias","Barnabas","Silas"],a:0,r:"Acts 1:26",e:"The apostles prayed and cast lots. Matthias had been with Jesus from his baptism."},
 {c:"Apostles and Paul",q:"On what day did the Holy Spirit come with tongues of fire?",o:["Pentecost","Passover","Tabernacles"],a:0,r:"Acts 2:1",e:"Believers spoke in other languages and about 3,000 people were baptized that day."},
 {c:"Apostles and Paul",q:"Who traveled with Paul on his first missionary journey?",o:["Barnabas","Timothy","Titus"],a:0,r:"Acts 13:2",e:"Barnabas means 'son of encouragement.' He believed in Paul when others feared him."},
 {c:"Apostles and Paul",q:"Which disciple is called the one Jesus loved and wrote Revelation?",o:["John","Andrew","James"],a:0,r:"John 13:23",e:"John also wrote the Gospel of John and three letters, and was exiled on the island of Patmos."},
 {c:"Apostles and Paul",q:"On which island was Paul shipwrecked?",o:["Malta","Crete","Cyprus"],a:0,r:"Acts 28:1",e:"The people showed unusual kindness. Paul was bitten by a snake and was not harmed."},
 {c:"Apostles and Paul",q:"Which young pastor did Paul mentor?",o:["Timothy","Cornelius","Apollos"],a:0,r:"1 Timothy 1:2",e:"Paul called him 'my true child in the faith' and wrote two letters to him."},
 {c:"Apostles and Paul",q:"Who sang hymns with Paul in prison at midnight?",o:["Silas","Luke","Mark"],a:0,r:"Acts 16:25",e:"An earthquake opened the doors, and the jailer and his household believed."},
 {c:"Apostles and Paul",q:"What was Paul's trade?",o:["Tentmaker","Carpenter","Fisherman"],a:0,r:"Acts 18:3",e:"Paul worked with his own hands so he would not burden the churches."},
 {c:"Apostles and Paul",q:"What did Peter do when Jesus called him from the boat in Matthew 14?",o:["Stepped out onto the water","Stayed in the boat","Swam to shore"],a:0,r:"Matthew 14:29",e:"He began to sink when he saw the wind. Jesus caught him and said, 'You of little faith, why did you doubt?'"},

 {c:"Creation and Genesis",q:"What did God create on the first day?",o:["Light","The sun","Land"],a:0,r:"Genesis 1:3",e:"God said, 'Let there be light,' and there was light. He separated the light from the darkness."},
 {c:"Creation and Genesis",q:"What did God do on the seventh day?",o:["Rested","Made the stars","Made people"],a:0,r:"Genesis 2:2",e:"God blessed the seventh day and made it holy. It is the pattern for the Sabbath."},
 {c:"Creation and Genesis",q:"What tree were Adam and Eve told not to eat from?",o:["The tree of the knowledge of good and evil","The olive tree","The fig tree"],a:0,r:"Genesis 2:17",e:"Eating from it brought sin and death into the world."},
 {c:"Creation and Genesis",q:"What was the sign of God's promise after the flood?",o:["A rainbow","A dove","An olive tree"],a:0,r:"Genesis 9:13",e:"God promised never again to flood the whole earth."},
 {c:"Creation and Genesis",q:"Who was Cain's brother?",o:["Abel","Seth","Enoch"],a:0,r:"Genesis 4:2",e:"Cain became jealous when God accepted Abel's offering. God warned him that sin was crouching at the door."},
 {c:"Creation and Genesis",q:"What were people trying to build at Babel?",o:["A tower to the heavens","A great wall","A temple"],a:0,r:"Genesis 11:4",e:"God confused their languages and the people scattered."},
 {c:"Creation and Genesis",q:"Who was Abraham's wife?",o:["Sarah","Rebekah","Leah"],a:0,r:"Genesis 17:15",e:"God changed her name from Sarai to Sarah. She had Isaac when she was 90."},
 {c:"Creation and Genesis",q:"Which twin was born first to Isaac and Rebekah?",o:["Esau","Jacob","Levi"],a:0,r:"Genesis 25:25",e:"Jacob came out holding his brother's heel, so his name means 'he grasps the heel'."},
 {c:"Creation and Genesis",q:"Who wrestled with God and was renamed Israel?",o:["Jacob","Isaac","Joseph"],a:0,r:"Genesis 32:28",e:"Israel means 'he struggles with God'. The twelve tribes came from his sons."},
 {c:"Creation and Genesis",q:"Who interpreted Pharaoh's dreams about cows and grain?",o:["Joseph","Moses","Aaron"],a:0,r:"Genesis 41:25",e:"Joseph said seven years of plenty would be followed by seven years of famine. Pharaoh put him in charge."},
 {c:"Creation and Genesis",q:"What did God create on the sixth day?",o:["Land animals and people","Birds and fish","The sun and moon"],a:0,r:"Genesis 1:26",e:"God made people in his own image and called everything very good."},

 {c:"Women of the Bible",q:"Who hid the Israelite spies in Jericho?",o:["Rahab","Deborah","Miriam"],a:0,r:"Joshua 2:4",e:"Rahab put a scarlet cord in her window and was saved when the city fell."},
 {c:"Women of the Bible",q:"Which prophetess and judge led Israel with Barak?",o:["Deborah","Huldah","Abigail"],a:0,r:"Judges 4:4",e:"Deborah sat under a palm tree and settled disputes. Under her leadership Israel won a great victory."},
 {c:"Women of the Bible",q:"Who was the mother of Samuel?",o:["Hannah","Ruth","Naomi"],a:0,r:"1 Samuel 1:20",e:"Hannah prayed for a child and gave Samuel back to serve God at the temple."},
 {c:"Women of the Bible",q:"Which woman poured expensive perfume on Jesus' feet and wiped them with her hair?",o:["Mary of Bethany","Martha","Salome"],a:0,r:"John 12:3",e:"The house was filled with the smell. Jesus said she had done a beautiful thing."},
 {c:"Women of the Bible",q:"Which sister sat at Jesus' feet to listen while the other worked?",o:["Mary","Martha","Rhoda"],a:0,r:"Luke 10:39",e:"Jesus said Mary had chosen the better part, which would not be taken from her."},
 {c:"Women of the Bible",q:"Who was the first to see Jesus after the resurrection?",o:["Mary Magdalene","Peter","John"],a:0,r:"John 20:16",e:"She thought he was the gardener until he said her name, 'Mary.'"},
 {c:"Women of the Bible",q:"Who was a seller of purple cloth whose heart the Lord opened?",o:["Lydia","Priscilla","Phoebe"],a:0,r:"Acts 16:14",e:"Lydia and her household were baptized. Her home became a meeting place for the church."},
 {c:"Women of the Bible",q:"Who was Timothy's grandmother?",o:["Lois","Eunice","Anna"],a:0,r:"2 Timothy 1:5",e:"Paul praised the sincere faith that lived first in his grandmother Lois and his mother Eunice."},
 {c:"Women of the Bible",q:"Who was the mother of John the Baptist?",o:["Elizabeth","Mary","Anna"],a:0,r:"Luke 1:57",e:"She was Mary's relative. John leaped in her womb when Mary greeted her."},
 {c:"Women of the Bible",q:"Whose two small coins did Jesus say were the greatest gift?",o:["A poor widow's","A rich woman's","A priest's"],a:0,r:"Mark 12:42",e:"She gave everything she had, while others gave out of their abundance."},

 {c:"Kings and Kingdoms",q:"Who was the first king of Israel?",o:["Saul","David","Solomon"],a:0,r:"1 Samuel 10:1",e:"Saul was tall and chosen when Israel asked for a king like other nations. Samuel anointed him."},
 {c:"Kings and Kingdoms",q:"Who built the first temple in Jerusalem?",o:["Solomon","David","Hezekiah"],a:0,r:"1 Kings 6:1",e:"It took seven years. David had planned it but God said his son would build it."},
 {c:"Kings and Kingdoms",q:"Which young king found the Book of the Law and led a great revival?",o:["Josiah","Ahab","Jehoram"],a:0,r:"2 Kings 22:8",e:"Josiah became king at eight years old. When the Law was read he tore his clothes and led the people back to God."},
 {c:"Kings and Kingdoms",q:"Which king saw writing appear on the wall at a feast?",o:["Belshazzar","Nebuchadnezzar","Darius"],a:0,r:"Daniel 5:5",e:"Daniel read it: 'Mene, Mene, Tekel, Parsin.' That night the kingdom fell."},
 {c:"Kings and Kingdoms",q:"Which king dreamed of a giant statue and asked Daniel to interpret it?",o:["Nebuchadnezzar","Cyrus","Xerxes"],a:0,r:"Daniel 2:31",e:"Daniel said God had revealed it and that God's kingdom would never be destroyed."},
 {c:"Kings and Kingdoms",q:"Which Persian king let the Jews return and rebuild the temple?",o:["Cyrus","Darius","Artaxerxes"],a:0,r:"Ezra 1:1",e:"God stirred the king's heart, fulfilling what Jeremiah and Isaiah had said."},
 {c:"Kings and Kingdoms",q:"Which king ordered the baby boys of Bethlehem to be killed?",o:["Herod","Pilate","Caesar Augustus"],a:0,r:"Matthew 2:16",e:"Joseph was warned in a dream and took Mary and Jesus safely to Egypt."},
 {c:"Kings and Kingdoms",q:"Which king prayed and was given fifteen more years of life?",o:["Hezekiah","Josiah","Asa"],a:0,r:"Isaiah 38:5",e:"Isaiah told him he would die. Hezekiah turned to the wall and prayed, and God changed the answer."},
 {c:"Kings and Kingdoms",q:"Whose harsh words after Solomon divided the kingdom in two?",o:["Rehoboam","Jeroboam","Ahab"],a:0,r:"1 Kings 12:13",e:"He ignored the elders' advice. Ten tribes followed Jeroboam and two followed Rehoboam."},
 {c:"Kings and Kingdoms",q:"Which king had his throne in Jerusalem and was called a man after God's own heart?",o:["David","Saul","Ahab"],a:0,r:"1 Samuel 13:14",e:"David sinned greatly, but he repented. His line led to Jesus."},

 {c:"Numbers and Facts",q:"How many books are in the New Testament?",o:["27","39","66"],a:0,r:"The New Testament",e:"It begins with Matthew and ends with Revelation. There are four Gospels, Acts, 21 letters and Revelation."},
 {c:"Numbers and Facts",q:"How many tribes of Israel were there?",o:["10","12","7"],a:1,r:"Genesis 49:28",e:"They came from the twelve sons of Jacob, also called Israel."},
 {c:"Numbers and Facts",q:"How many years did Israel wander in the wilderness?",o:["7","40","70"],a:1,r:"Numbers 14:33",e:"The people refused to enter the land at first, so a whole generation passed before they did."},
 {c:"Numbers and Facts",q:"How many commandments did God give Moses on the tablets?",o:["Ten","Twelve","Seven"],a:0,r:"Exodus 20",e:"The first four are about loving God and the other six about loving others."},

async function bibleFetch(ref){
  const k="fh_b_"+ver+"_"+ref;
  try{const c=localStorage.getItem(k);if(c)return JSON.parse(c);}catch(e){}
  if(ver==="esv"&&ESV_KEY){
    const er=await fetch("https://api.esv.org/v3/passage/text/?q="+encodeURIComponent(ref)+"&include-headings=false&include-footnotes=false&include-short-copyright=false&include-passage-references=false&include-verse-numbers=true",{headers:{Authorization:"Token "+ESV_KEY}});
    const ej=await er.json();
    if(ej&&ej.passages&&ej.passages[0]){
      const raw=ej.passages[0],nums=[];raw.replace(/\[(\d+)\]/g,(m,n)=>{nums.push(Number(n));return m;});
      const o={ref:(ej.canonical||ref)+" (ESV)",text:raw.replace(/\[\d+\]/g," ").replace(/\s+/g," ").trim(),verses:nums};
      try{localStorage.setItem(k,JSON.stringify(o));}catch(e){}
      return o;
    }
    throw new Error("not found");
  }
  const r=await fetch("https://bible-api.com/"+encodeURIComponent(ref)+"?translation="+(ver==="esv"?"web":ver));
  const j=await r.json();
  if(j&&j.text){
    const o={ref:j.reference||ref,text:j.text.trim().replace(/\s*\n\s*/g," "),verses:(j.verses||[]).map(v=>v.verse)};
    try{localStorage.setItem(k,JSON.stringify(o));}catch(e){}
    return o;
  }
  throw new Error("not found");
}

function wrapLines(g,text,maxW){
  const words=text.split(" "),lines=[];let cur="";
  for(const w of words){const t=cur?cur+" "+w:w;if(g.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}
  if(cur)lines.push(cur);return lines;
}
/* ---------- voice notes ---------- */
function recMime(){
  if(!window.MediaRecorder||!MediaRecorder.isTypeSupported)return "";
  for(const t of ["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"]){try{if(MediaRecorder.isTypeSupported(t))return t;}catch(e){}}
  return "";
}
function recErr(e){
  const n=e&&e.name;
  if(n==="NotAllowedError"||n==="SecurityError")return "The microphone is blocked. Allow it in your phone settings for this app, then try again.";
  if(n==="NotFoundError")return "No microphone found.";
  if(!window.MediaRecorder)return "This phone cannot record sound in the app. Update your browser.";
  return "Could not record. Close the app, open it again, and retry.";
}
function audioHtml(src,st){
  src=String(src||"");if(!src.startsWith("data:audio/"))return "";
  const t=(src.slice(5,src.indexOf(";"))||"audio/mp4"),ok=(()=>{try{return document.createElement("audio").canPlayType(t);}catch(e){return "maybe";}})();
  if(!ok)return `<div class="meta" style="margin-top:6px">🎙️ This voice message was recorded on another phone and this phone cannot play it. Ask them to send it again.</div>`;
  return `<audio controls preload="metadata" src="${src}" style="${st||"width:100%;margin-top:6px"}"></audio>`;
}
async function toggleRec(){
  if(rec&&rec.state==="recording"){rec.stop();return;}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    const mime=recMime();
    rec=new MediaRecorder(st,mime?{mimeType:mime,audioBitsPerSecond:24000}:{audioBitsPerSecond:24000});chunks=[];voiceDraft=null;
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{st.getTracks().forEach(t=>t.stop());clearTimeout(recTimer);const b=new Blob(chunks,{type:(rec.mimeType||mime||"audio/mp4").split(";")[0]});const fr=new FileReader();fr.onload=()=>{voiceDraft=fr.result;render();};fr.readAsDataURL(b);};
    rec.start();recTimer=setTimeout(()=>{if(rec&&rec.state==="recording")rec.stop();},60000);render();
  }catch(e){toast(recErr(e));}
}

function startCalm(mins){

  let end=Date.now()+mins*60000,pi=-1,left=0;
  const tick=()=>{
    if(Date.now()>=end){stopCalm();if(el){el.textContent="Well done 💛";el.style.transform="scale(1)";}return;}
    if(left<=0){pi=(pi+1)%3;left=phases[pi][1];if(el){el.style.transition=`transform ${phases[pi][1]}s ease-in-out`;el.style.transform=`scale(${phases[pi][2]})`;el.textContent=phases[pi][0];}}

  };
  tick();calmTimer=setInterval(tick,1000);
}

function listItems(sub){
  const def=defOf(sub);
  let l=items.filter(i=>i.type===def.type&&visible(i)&&(!def.where||def.where(i)));
  if(filt!=="all")l=l.filter(i=>i.author===filt);
  if(secOpts(sub).mine)l=l.filter(i=>i.author===me);
  if(sub==="prayer"&&catFilt==="need")l=l.filter(i=>!i.answered&&((i.reactions||{}).amen||[]).length===0);else if(sub==="prayer"&&catFilt!=="all")l=l.filter(i=>(i.cat||"Myself")===catFilt);
  if(q)l=l.filter(i=>JSON.stringify({...i,photo:"",audio:""}).toLowerCase().includes(q.toLowerCase()));
  if(def.type==="event")l.sort((a,b)=>(evDate(a)||"").localeCompare(evDate(b)||""));

const WX={0:"☀️",1:"🌤️",2:"⛅",3:"☁️",45:"🌫️",48:"🌫️",51:"🌦️",53:"🌦️",55:"🌧️",61:"🌧️",63:"🌧️",65:"🌧️",71:"🌨️",73:"🌨️",75:"❄️",80:"🌦️",81:"🌧️",82:"⛈️",95:"⛈️",96:"⛈️",99:"⛈️"};
async function geocode(name){
  const r=await fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&name="+encodeURIComponent(name));const j=await r.json();
  if(!j.results||!j.results[0])throw new Error("nf");const x=j.results[0];
  return {name:x.name+(x.admin1?", "+x.admin1:""),lat:x.latitude,lon:x.longitude};
}
async function forecast(lat,lon){
  const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&temperature_unit=fahrenheit&timezone=auto&forecast_days=16`);
  return r.json();
}
const tm=s=>{try{return new Date(s).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});}catch(e){return s;}};
function moonPhase(d=new Date()){
  const syn=29.530588853,age=((((d-Date.UTC(2000,0,6,18,14))/864e5)%syn)+syn)%syn,i=Math.floor(age/syn*8+.5)%8;
  return {name:["New moon","Waxing crescent","First quarter","Waxing gibbous","Full moon","Waning gibbous","Last quarter","Waning crescent"][i],emoji:["🌑","🌒","🌓","🌔","🌕","🌖","🌗","🌘"][i],illum:Math.round((1-Math.cos(2*Math.PI*age/syn))/2*100)};
}
function myLoc(){try{return JSON.parse(localStorage.getItem("fh_loc")||"null");}catch(e){return null;}}

  const L=myLoc();if(!L)return;

}

async function tripWeather(id){
  const t=items.find(x=>x.id===id);if(!t)return;
  openDlg(`<h3>☀️ Weather: ${esc(t.place||t.title||"your trip")}</h3><div id="wxbox">Loading...</div><div class="row"><button class="btn" data-act="close">Close</button></div>`);
  try{
    const g=await geocode(t.place||t.title),j=await forecast(g.lat,g.lon),dd=j.daily;
    let idx=dd.time.map((d,i)=>i),note="";
    if(t.start){const f=idx.filter(i=>dd.time[i]>=t.start&&dd.time[i]<=(t.end||t.start));if(f.length)idx=f;else{idx=idx.slice(0,7);note="Your trip dates are past the 16 day forecast. Showing the next 7 days.";}}
    else idx=idx.slice(0,7);
    const html=`<div class="meta">${esc(g.name)}</div>${note?`<div class="meta">${note}</div>`:""}`+idx.map(i=>`<div class="card" style="padding:8px 12px">${WX[dd.weathercode[i]]||"🌡️"} <b>${esc(fmtDay(dd.time[i]))}</b><br>${Math.round(dd.temperature_2m_max[i])}° / ${Math.round(dd.temperature_2m_min[i])}° · ${dd.precipitation_probability_max[i]||0}% rain<br><span class="meta">🌅 ${tm(dd.sunrise[i])} · 🌇 ${tm(dd.sunset[i])}</span></div>`).join("");
    if($("wxbox"))$("wxbox").innerHTML=html;
  }catch(e){if($("wxbox"))$("wxbox").textContent="Could not load the weather. Check the place name and your connection.";}
}
/* share pictures */
const SCENES={dusk:"Dusk",forest:"Forest",ocean:"Ocean",sunrise:"Sunrise",night:"Night sky",classic:"Classic"};
function hill(g,W,H,y,amp,col,ph){g.fillStyle=col;g.beginPath();g.moveTo(0,H);for(let x=0;x<=W;x+=20)g.lineTo(x,y+Math.sin(x/W*Math.PI*2+ph)*amp+Math.sin(x/W*Math.PI*5+ph)*amp*.4);g.lineTo(W,H);g.closePath();g.fill();}
function drawVerse(c,ref,text,s){
  const g=c.getContext&&c.getContext("2d");if(!g)return;
  const W=1080,H=1350,P={dusk:["#3b2a5c","#b5547a","#f0a35e"],forest:["#173a2e","#2f6b4f","#8dbb7a"],ocean:["#0f3057","#2b78a8","#8ed1e0"],sunrise:["#7a3e5c","#e0795a","#f6c56b"],night:["#0b1026","#27285a","#4b4a8a"],classic:["#1c1a1f","#33281d","#4a3523"]}[s]||["#1c1a1f","#33281d","#4a3523"];
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,P[0]);gr.addColorStop(.6,P[1]);gr.addColorStop(1,P[2]);g.fillStyle=gr;g.fillRect(0,0,W,H);
  if(s==="dusk"||s==="sunrise"){g.fillStyle="rgba(255,235,190,.85)";g.beginPath();g.arc(540,1010,130,0,Math.PI*2);g.fill();hill(g,W,H,1120,40,"rgba(30,20,40,.85)",1);hill(g,W,H,1200,30,"rgba(15,10,25,.95)",3);}
  else if(s==="forest"){hill(g,W,H,1100,50,"rgba(20,60,45,.9)",0);hill(g,W,H,1200,40,"rgba(10,40,30,.95)",2);g.fillStyle="rgba(8,30,22,.95)";for(let x=40;x<W;x+=90){const h=90+((x*7)%60);g.beginPath();g.moveTo(x,1350);g.lineTo(x+35,1350-h);g.lineTo(x+70,1350);g.fill();}}
  else if(s==="ocean"){for(let k=0;k<5;k++)hill(g,W,H,1000+k*70,24,`rgba(${20+k*10},${70+k*15},${120+k*15},.7)`,k);}
  else if(s==="night"){g.fillStyle="#fff";for(let k=0;k<90;k++){const x=(k*137)%W,y=(k*263)%900,r=(k%3)+1;g.globalAlpha=.4+(k%5)/10;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();}g.globalAlpha=1;g.fillStyle="rgba(250,245,220,.9)";g.beginPath();g.arc(880,230,70,0,Math.PI*2);g.fill();hill(g,W,H,1230,30,"rgba(5,8,20,.95)",1);}
  g.shadowColor="rgba(0,0,0,.55)";g.shadowBlur=14;g.textAlign="center";g.fillStyle="#ffd9a0";g.font="bold 40px sans-serif";g.fillText("VERSE OF THE DAY",540,150);
  let size=64,lines=[];
  for(;size>=30;size-=2){g.font=`italic ${size}px Georgia, serif`;lines=wrapLines(g,"“"+text+"”",880);if(lines.length*size*1.4<=800)break;}
  g.fillStyle="#fff";const top=Math.max(280,640-lines.length*size*0.7);
  lines.forEach((l,i)=>g.fillText(l,540,top+i*size*1.4));
  g.fillStyle="#ffd9a0";g.font="bold 48px sans-serif";g.fillText(ref,540,Math.min(1060,top+lines.length*size*1.4+90));
  g.shadowBlur=0;g.fillStyle="rgba(255,255,255,.75)";g.font="30px sans-serif";g.fillText("Faith Hub",540,1300);
}
function shareCard(ref,text){
  shareCur={ref,text};
  openDlg(`<h3>📤 Share a picture</h3><canvas id="scv" width="1080" height="1350" style="width:100%;border-radius:12px"></canvas><div class="chips">${Object.entries(SCENES).map(([k,v])=>`<button class="chip ${scn===k?"on":""}" data-act="scene" data-s="${k}">${v}</button>`).join("")}</div><div class="row"><button class="btn" data-act="shareout">Share or save</button><button class="btn ghost" data-act="close">Close</button></div>`);

function shareOut(){
  const c=$("scv");if(!c||!c.toBlob)return;
  c.toBlob(async b=>{
    const f=new File([b],"verse.png",{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],text:shareCur.ref});return;}catch(e){}}
    const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="verse.png";document.body.appendChild(a);a.click();a.remove();
    toast("Saved the picture to your downloads");
  },"image/png");
}
function confetti(){
  if(document.documentElement.dataset.calm||(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches))return;
  const c=document.createElement("canvas");c.className="cf";c.width=innerWidth;c.height=innerHeight;
  const g=c.getContext&&c.getContext("2d");if(!g)return;document.body.appendChild(c);
  const cols=["#e0a062","#2f8f5b","#3d6fb5","#b3392f","#8a4fb5","#f6c56b"];
  const ps=Array.from({length:70},()=>({x:innerWidth/2,y:innerHeight*.6,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+3,c:cols[Math.floor(Math.random()*cols.length)]}));
  let f=0;(function tick(){g.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;g.fillStyle=p.c;g.fillRect(p.x,p.y,p.r,p.r*1.6);});if(++f<90)requestAnimationFrame(tick);else c.remove();})();
}

  if(it.type==="todo"&&it.list==="Gear")return ["play","gear"];

function metaHits(v){
  if(sf.t!=="all"||sf.d)return [];
  const out=[];
  Object.entries(metas.bucket||{}).forEach(([id,r])=>{if(r&&r.t&&lc(r.t).includes(v)&&(sf.p==="all"||r.by===sf.p))out.push(["🪣 Bucket list","bucket",r.t,r.by]);});
  Object.entries(metas).forEach(([k,r])=>{if(k.startsWith("cn_")&&r&&lc((r.title||"")+" "+(r.text||"")).includes(v)&&(sf.p==="all"||r.editor===sf.p))out.push(["📝 Shared note","notes",r.title||"Note",r.editor||""]);});
  Object.entries(metas.study||{}).forEach(([id,r])=>{if(r&&r.ref&&lc(r.ref+" "+Object.values(r.notes||{}).map(n=>n.t).join(" ")).includes(v))out.push(["📖 Bible study","study",r.ref,r.by||""]);});
  Object.entries(metas.polls||{}).forEach(([id,r])=>{if(r&&r.q&&lc(r.q).includes(v)&&(sf.p==="all"||r.by===sf.p))out.push(["🗳️ Poll","polls",r.q,r.by]);});
  return out.slice(0,8);
}
function runSearch(v){
  v=lc(v).trim();const box=$("gres");if(!box)return;
  if(v.length<2){box.innerHTML="";return;}
  const r=items.filter(i=>visible(i)&&!["strong","replace","why","agree"].includes(i.type)&&(sf.p==="all"||i.author===sf.p)&&(sf.t==="all"||i.type===sf.t)&&(!sf.d||(i.created||0)>Date.now()-sf.d*864e5)&&lc(JSON.stringify({...i,photo:"",audio:"",audience:"",reactions:"",type:""})).includes(v)).sort((a,b)=>(b.created||0)-(a.created||0)).slice(0,25);
  const jump=["faith","together","play"].flatMap(g=>GROUPS[g].subs.filter(x=>lc(LBL[x]||x).includes(v)).map(x=>[g,x])).slice(0,6);
  const jh=jump.length?`<div class="meta">Go to a section</div><div class="row">${jump.map(([g,x])=>`<button class="chip" data-act="goto" data-g="${g}" data-s="${x}">${esc(LBL[x]||x)}</button>`).join("")}</div>`:"";
  srRemember(v);const mh=metaHits(v);
  box.innerHTML=jh+mh.map(([l,sub,t,by])=>`<div class="card" style="padding:10px 14px"><div class="meta">${l}${by?" · "+esc(by):""}</div><div>${esc(String(t).slice(0,90))}</div><div class="row"><button class="btn small ghost" data-act="goto" data-g="together" data-s="${sub}">Open</button></div></div>`).join("")+(r.length||mh.length?r.map(i=>{const S=SECTIONS[i.type]||{icon:"",label:""};return `<div class="card" style="padding:10px 14px"><div class="meta">${S.icon} ${esc(S.label)} · ${esc(i.author)}</div><div>${esc(String(i.title||i.text||i.ref||i.place||i.for||"").slice(0,90))}</div><div class="row"><button class="btn small ghost" data-act="gopen" data-id="${i.id}">Open</button></div></div>`;}).join(""):`<p class="empty">Nothing found.</p>`);
}

  else if(a==="yttog"){localStorage.setItem("fh_yt_off",localStorage.getItem("fh_yt_off")==="1"?"0":"1");render();}
  else if(a==="ytoff"){localStorage.setItem("fh_yt_off","1");render();toast("Hidden. Turn it back on under Pin to Home.");}
  else if(a==="ytgo"){goSub(d.g,d.s);}
  else if(a==="pkset"){pk[d.k]=d.k==="mood"?d.v:Number(d.v);pk.n=0;render();}
  else if(a==="pknext"){pk.n++;render();}
  else if(a==="pkgo"){goSub(d.g,d.s);}
  else if(a==="pkinv"){const to=PEOPLE.filter(p=>p!==me&&!(p==="Madison"&&STRONGP.includes(me)&&false));if(!to.length){toast("No one to invite");return;}openDlg(`<h3>💌 Send this invite?</h3><p>${esc(d.n)}, about ${pk.min} minutes.</p><div class="meta">Goes to: ${to.map(esc).join(", ")}</div><div class="row"><button class="btn" data-act="pksend" data-n="${esc(d.n)}" data-go="sub:${d.g}/${d.s}">Send</button><button class="btn ghost" data-act="close">Cancel</button></div>`);}
  else if(a==="pksend"){d.go=d.go;const to=PEOPLE.filter(p=>p!==me);sendPing(to,"invites you to: "+d.n+" 🎲","invite",d.go||"home").then(()=>{closeDlg();toast("Invite sent 💌");});}
  else if(a==="tnready"){setMeta("tonight",{[ymd(new Date())]:{ready:{[me]:!(tonightRec().ready||{})[me]}}});}
  else if(a==="tnopen"){goSub(d.g,d.s);}
  else if(a==="tndone"||a==="tnpass"){const k=a==="tndone"?"done":"pass",o=tonightRec(),i=Number(d.i);setMeta("tonight",{[ymd(new Date())]:{[k]:{[me]:FV.arrayUnion(i)}}});if(k==="done"&&(o.pass||{})[me]&&(o.pass[me]||[]).includes(i))setMeta("tonight",{[ymd(new Date())]:{pass:{[me]:FV.arrayRemove(i)}}});}
  else if(a==="hostvol"){setMeta("host",{willing:{[me]:!(hostRec().willing||{})[me]}});}
  else if(a==="hostsave"&&hostRec().cur===me){setMeta("host",{text:(($("hosttx")||{}).value||"").trim().slice(0,400),ts:Date.now()});toast("Saved");}
  else if(a==="hostrand"){const w=Object.entries(hostRec().willing||{}).filter(([k,v])=>v).map(x=>x[0]);if(!w.length){toast("Nobody is willing yet");return;}setMeta("host",{cur:w[Math.floor(Math.random()*w.length)],text:"",ts:Date.now()});}
  else if(a==="hostpass"&&hostRec().cur===me){const w=Object.entries(hostRec().willing||{}).filter(([k,v])=>v&&k!==me).map(x=>x[0]);setMeta("host",{cur:w.length?w[Math.floor(Math.random()*w.length)]:"",text:"",ts:Date.now()});toast("Passed");}
  else if(a==="uqpick"){setMeta("uqa",{[d.id]:{[me]:d.v}});}
  else if(a==="uqreport"){if(!db)return;const it=items.find(x=>x.id===d.id);db.collection("feedback").add({fromLc:lc(me||"someone"),from:me||"Someone",text:"Reported user quiz: "+String((it&&it.q)||"").slice(0,200),kind:"Reported quiz",ts:Date.now(),v:APP_VER}).then(()=>toast("Reported"));}
  else if(a==="memomode"){memoMode=d.k;memoShow=false;memoPick=[];render();}
  else if(a==="memolvl"){memoLvl=Number(d.n);render();}
  else if(a==="memoreset"){memoPick=[];render();}
  else if(a==="memoword"){const pool=versePool(),v=pool[memoI%pool.length],w=memoWords(v),i=Number(d.i);if(w[i]===w[memoPick.length]){memoPick.push(i);if(memoPick.length===w.length)memoLog();}else toast("Not that one. Try again.");render();}
  else if(a==="bkLater"){localStorage.setItem("fh_lastbk",String(Date.now()));render();}
  else if(a==="pldisc"){plDisc(Number(d.d));}
  else if(a==="plsay"){const dd=Number(d.d),t=(($("plt")||{}).value||"").trim();if(!t||!db)return;const b=e.target;if(b.disabled)return;b.disabled=true;setMeta("pd_"+planKey,{[dd]:{[Date.now()+"_"+lc(me)]:{by:me,t:t.slice(0,500),ts:Date.now()}}});sendPing((((metas.planmem||{})[planKey])||[]).filter(p=>p!==me),"wrote on day "+dd+" of "+PLANS[planKey].n,"activity","sub:faith/plan");setTimeout(()=>plDisc(dd),250);}
  else if(a==="memoprac"){memoLog();toast("Nice 🧠");}
  else if(a==="pinit"){const it=items.find(x=>x.id===d.id);if(it&&it.author===me){patch(d.id,{pinned:!it.pinned});toast(it.pinned?"Unpinned":"Pinned to the top");}}
  else if(a==="chkupd"){toast("Checking...");(async()=>{try{if(navigator.serviceWorker){const r=await navigator.serviceWorker.getRegistration();if(r)await r.update();}const t=await (await fetch("./index.html?c="+Date.now(),{cache:"no-store"})).text();const m=/const APP_VER="([^"]+)"/.exec(t);if(m&&m[1]!==APP_VER){toast("Version "+m[1]+" is ready. Reopening...");setTimeout(()=>location.reload(),1200);}else toast("You are up to date ("+APP_VER+")");}catch(e){toast("Could not check. Are you online?");}})();}
  else if(a==="health"){healthDlg();}
  else if(a==="idleset"){localStorage.setItem("fh_idle",d.v);render();toast(d.v==="0"?"Auto sign out is off":"Signs out after "+d.v+" minutes away");}
  else if(a==="ttoff"){localStorage.setItem("fh_tt_off","1");render();toast("Hidden. Turn it back on under Pin to Home.");}
  else if(a==="tttog"){localStorage.setItem("fh_tt_off",localStorage.getItem("fh_tt_off")==="1"?"0":"1");render();}
  else if(a==="circpray"){const k=ymd(new Date()),on=!!(((metas.circle||{})[k]||{})[me]);setMeta("circle",{[k]:{[me]:!on}});}
  else if(a==="cmp"){cmpOpen(d.ref||(($("bedref")||{}).textContent||"").trim());}
  else if(a==="hctog"){const on=localStorage.getItem("fh_hc")==="1";localStorage.setItem("fh_hc",on?"0":"1");if(on)delete document.documentElement.dataset.hc;else document.documentElement.dataset.hc="1";render();}
  else if(a==="stat"){const r=(metas.study||{})[d.id]||{},n=Math.max(1,Math.min(200,Number(r.at||1)+Number(d.d)));setMeta("study",{[d.id]:{at:n,atBy:me}});}
  else if(a==="autobk"){const on=localStorage.getItem("fh_autobk")==="1";localStorage.setItem("fh_autobk",on?"0":"1");render();toast(on?"Weekly backup is off":"Weekly backup is on");}
  else if(a==="keepsake"){keepsake();}
  else if(a==="news")showNews();
  else if(a==="newsdone"){localStorage.setItem("fh_ver_seen",APP_VER);closeDlg();}
  else if(a==="tour"){const i=Number(d.i);if(i>=TOUR.length){localStorage.setItem("fh_tour","1");localStorage.setItem("fh_ver_seen",APP_VER);closeDlg();render();}else openTour(i);}
  else if(a==="tourreplay")openTour(0);
  else if(a==="lookup")lookup(false);
  else if(a==="lookupw"){wizCapture();lookup(true);}
  else if(a==="dictate")dictate(d.n);
  else if(a==="reply"){const dn=repliedSet();dn.push(d.id);localStorage.setItem("fh_replied",JSON.stringify(dn.slice(-40)));sendPing([d.p],d.t,"reply").then(()=>toast("Sent 💛"));render();}
  else if(a==="prayday"){if(db){setMeta("praydays",{[me]:FV.arrayUnion(ymd(new Date()))});confetti();toast("Thank you for praying 🙏");}else toast("Sharing is not set up yet");}
  else if(a==="sotwdlg")sotwDlg();
  else if(a==="sotwfill"){$("sotwr").value=d.r;}
  else if(a==="sotwsave")sotwSave();
  else if(a==="askpraydlg")askPrayDlg();
  else if(a==="askprayto"){sendPing([d.p],"","askpray").then(()=>{closeDlg();toast("Asked "+d.p+" 🤍");});}
  else if(a==="tellpray")tellPrayDlg(d.id,d.p);
  else if(a==="tellprayend"){const t=($("tpt").value||"").trim();if(!t){toast("Write something first");return;}const dn=repliedSet();dn.push(d.id);localStorage.setItem("fh_replied",JSON.stringify(dn.slice(-40)));save({type:"prayer",text:t,for:"Prayer request",cat:"Friends",author:me,created:Date.now(),vis:[me,d.p]},true);sendPing([d.p],t,"prayer");closeDlg();toast("Sent 🙏");render();}
  else if(a==="answersave"){const it2=items.find(x=>x.id===d.id);if(it2){save({...it2,answered:true,answer:($("ans").value||"").trim()});confetti();}closeDlg();}
  else if(a==="chatrec")chatRec();
  else if(a==="bioon")bioEnable();
  else if(a==="bioff"){localStorage.removeItem("fh_bio");toast("Lock is off");render();}
  else if(a==="whydlg")whyDlg();
  else if(a==="whysave")whySave();
  else if(a==="weeklydlg")weeklyDlg();
  else if(a==="weeklysave")weeklySave();
  else if(a==="memtest")memTest();
  else if(a==="memshow"){$("mans").style.display="block";}
  else if(a==="goodnight"){const o=PEOPLE.filter(p=>p!==me);sendPing(o,"Goodnight. Praying for you tonight.","goodnight").then(()=>toast("Goodnight sent 🌙"));}
  else if(a==="seenmissed"){localStorage.setItem("fh_seenmissed",String(Date.now()));render();}
  else if(a==="goodnews")goodNewsDlg();
  else if(a==="gnsend"){const t=($("gnt").value||"").trim(),to=[...document.querySelectorAll(".gnto")].filter(x=>x.checked).map(x=>x.value);if(!t||!to.length){toast("Write something and pick someone");return;}sendPing(to,t,"goodnews").then(()=>{closeDlg();confetti();toast("Sent 🎉");});}
  else if(a==="replacedlg")replaceDlg();
  else if(a==="replacesave")replaceSave();
  else if(a==="strongsos")strongSos();
  else if(a==="strongok"){const was=strongLog()[ymd(new Date())]==="strong",n=strongStreak()+(was?0:1);strongLogSave("Stayed strong");closeDlg();confetti();toast(!was&&BADGES.includes(n)?"🏅 "+n+" days strong!":"Great job. Keep going 💪");render();}
  else if(a==="strongfell")strongFell();
  else if(a==="strongtell"){sendPing([d.p],d.k==="fell"?"could use a prayer today":"wants to talk","support").then(()=>{closeDlg();toast(d.p+" has been notified 💛");});}
  else if(a==="close")closeDlg();
});
window.addEventListener("error",e=>{if(db&&errCount++<5)db.collection("errors").add({msg:String(e.message).slice(0,200),line:e.lineno||0,from:me||"?",ts:Date.now(),v:APP_VER}).catch(()=>{});});
window.addEventListener("unhandledrejection",e=>{if(db&&errCount++<5)db.collection("errors").add({msg:String(e.reason&&e.reason.message||e.reason).slice(0,200),from:me||"?",ts:Date.now(),v:APP_VER}).catch(()=>{});});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
setTimeout(bioShow,0);
start();
</script>
